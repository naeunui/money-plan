<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="머랭" />
  <meta name="theme-color" id="themeColorMeta" content="#FCF4F5" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <title>머랭 · 다음 달 생활비 계획</title>
  <style>
    /* ---------- 테마 변수 ---------- */
    :root {
      --bg: #FCF4F5;
      --card: #FFFFFF;
      --card-2: #FBF3F4;
      --text: #26191D;
      --muted: #8A6E76;
      --line: #F0DDE2;
      --line-strong: #E3C6CE;
      --accent: #D2547A;
      --accent-soft: #FBE3EA;
      --accent-ink: #A83A5D;
      --on-accent: #FFFFFF;
      --knob: #FFFFFF;
      --in: #C13D62;
      --out: #3B2D32;
      --warn: #B3261E;
      --warn-soft: #FBEAE7;
      --sum-bg: #F8DFE6;
      --sum-fg: #2A1A20;
      --sum-muted: #7A5A64;
      --sum-line: #EFC9D4;
      --sum-in: #A62F55;
      --sum-out: #4B3A40;
      --set-a-bg: #FFF7F9;
      --set-a-line: #F6D9E1;
      --set-a-point: #C2466D;
      --set-b-bg: #F5F7FA;
      --set-b-line: #E6E9EF;
      --set-b-point: #5F6B7A;
      --mark-in: #2F6FEB;
      --mark-out: #E0455A;
      --shadow: 0 1px 2px rgba(38, 25, 29, .04), 0 10px 26px rgba(38, 25, 29, .06);
      --radius: 18px;
    }
    body[data-theme="mono"] {
      --bg: #F3F3F3;
      --card: #FFFFFF;
      --card-2: #F7F7F7;
      --text: #0B0B0B;
      --muted: #6E6E6E;
      --line: #E4E4E4;
      --line-strong: #C9C9C9;
      --accent: #0B0B0B;
      --accent-soft: #ECECEC;
      --accent-ink: #0B0B0B;
      --on-accent: #FFFFFF;
      --knob: #FFFFFF;
      --in: #0B0B0B;
      --out: #0B0B0B;
      --warn: #0B0B0B;
      --warn-soft: #ECECEC;
      --sum-bg: #0B0B0B;
      --sum-fg: #FFFFFF;
      --sum-muted: #A8A8A8;
      --sum-line: #2C2C2C;
      --sum-in: #FFFFFF;
      --sum-out: #D6D6D6;
      --set-a-bg: #E9E9E9;
      --set-a-line: #D3D3D3;
      --set-a-point: #0B0B0B;
      --set-b-bg: #FBFBFB;
      --set-b-line: #E4E4E4;
      --set-b-point: #7A7A7A;
      --mark-in: #2F6FEB;
      --mark-out: #D8424C;
      --shadow: none;
    }
    body[data-theme="dark"] {
      --bg: #0B0B0D;
      --card: #151519;
      --card-2: #1C1C21;
      --text: #F4F4F5;
      --muted: #9A9AA3;
      --line: #26262C;
      --line-strong: #3A3A42;
      --accent: #F2F2F4;
      --accent-soft: #232329;
      --accent-ink: #F4F4F5;
      --on-accent: #0B0B0D;
      --knob: #0B0B0D;
      --in: #F4F4F5;
      --out: #BEBEC7;
      --warn: #FF8E82;
      --warn-soft: #2A1A1A;
      --sum-bg: #17171C;
      --sum-fg: #F5F5F6;
      --sum-muted: #93939D;
      --sum-line: #2C2C33;
      --sum-in: #FFFFFF;
      --sum-out: #C4C4CD;
      --set-a-bg: #1A1418;
      --set-a-line: #34232B;
      --set-a-point: #EFA8BD;
      --set-b-bg: #121216;
      --set-b-line: #26262C;
      --set-b-point: #93A3B5;
      --mark-in: #6E9BF2;
      --mark-out: #F0656B;
      --shadow: none;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; width: 100%; overflow-x: hidden; }
    body {
      margin: 0; width: 100%; overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 0 12px calc(40px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
      transition: background .2s ease, color .2s ease;
    }
    body.locked { overflow: hidden; }
    .wrap { width: 100%; margin: 0 auto; }
    @media (min-width: 900px) {
      .wrap { max-width: 640px; }
    }
    svg { display: block; }

    /* ---------- 상단 ---------- */
    .appbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: calc(env(safe-area-inset-top) + 18px) 2px 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 10px; flex: none;
      background: var(--accent); color: var(--on-accent);
      display: grid; place-items: center;
    }
    .brand-mark svg { width: 19px; height: 19px; }
    .brand-name { font-size: 19px; font-weight: 800; letter-spacing: -.4px; }

    .theme-btn {
      display: flex; align-items: center; gap: 8px; flex: none;
      border: 1px solid var(--line-strong); background: var(--card); color: var(--text);
      border-radius: 999px; padding: 9px 15px 9px 11px; font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer;
    }
    .theme-btn svg { width: 16px; height: 16px; opacity: .55; }
    .theme-dot {
      width: 15px; height: 15px; border-radius: 50%; flex: none;
      border: 1.5px solid var(--line-strong);
    }

    .monthbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 10px; }
    .month-nav { display: flex; align-items: center; gap: 5px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 13px; flex: none;
      border: 1px solid var(--line-strong); background: var(--card); color: var(--text);
      display: grid; place-items: center; cursor: pointer;
    }
    .icon-btn svg { width: 20px; height: 20px; }
    .month-title {
      display: flex; align-items: center; justify-content: center; gap: 4px;
      font-size: 19px; font-weight: 800; letter-spacing: -.5px; min-width: 118px; text-align: center;
      padding: 6px 4px; margin: 0; border: none; background: transparent;
      color: var(--text); font-family: inherit; cursor: pointer; border-radius: 12px;
    }
    .month-title:active { background: var(--card-2); }
    .month-title svg { width: 15px; height: 15px; opacity: .5; flex: none; }
    .pill {
      font-size: 12.5px; font-weight: 700; padding: 6px 11px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap;
    }

    /* ---------- 요약 ---------- */
    .summary {
      position: relative;
      background: var(--sum-bg); color: var(--sum-fg);
      border: 1px solid var(--sum-line);
      border-radius: 22px; padding: 16px 18px 14px; margin: 92px 0 10px;
    }
    .mering-cat {
      position: absolute;
      right: 72px;
      top: -102px;
      width: 176px;
      height: auto;
      display: block;
      pointer-events: none;
      z-index: 2;
    }
    .sum-label { font-size: 13.5px; color: var(--sum-muted); font-weight: 600; }
    .sum-value {
      font-size: 32px; font-weight: 800; letter-spacing: -.9px; margin: 3px 0 2px;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .sum-sub { font-size: 13px; color: var(--sum-muted); margin-bottom: 11px; }
    .sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 11px; border-top: 1px solid var(--sum-line); }
    .sum-k { font-size: 12.5px; color: var(--sum-muted); font-weight: 600; }
    .sum-v { font-size: 17px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.3px; }
    .sum-v.in { color: var(--sum-in); }
    .sum-v.out { color: var(--sum-out); }

    /* ---------- 보기 전환 ---------- */
    .seg {
      display: flex; gap: 4px; padding: 4px; margin-bottom: 10px;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    }
    .seg button {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      border: none; background: transparent; color: var(--muted);
      font-family: inherit; font-size: 14.5px; font-weight: 700;
      padding: 9px 6px; border-radius: 11px; cursor: pointer;
    }
    .seg button svg { width: 16px; height: 16px; }
    .seg button.active { background: var(--accent); color: var(--on-accent); }
    body[data-theme="mono"] .seg button.active,
    body[data-theme="dark"] .seg button.active { background: var(--accent); color: var(--on-accent); }

    /* ---------- 2×2 카드 ---------- */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; align-items: stretch; }
    .set {
      border-radius: 20px; padding: 7px 6px 8px; min-width: 0;
      background: var(--set-bg); border: 1px solid var(--set-line);
      display: flex; flex-direction: column; gap: 7px;
    }
    .set-a { --set-bg: var(--set-a-bg); --set-line: var(--set-a-line); --set-point: var(--set-a-point); }
    .set-b { --set-bg: var(--set-b-bg); --set-line: var(--set-b-line); --set-point: var(--set-b-point); }
    .set-head {
      display: flex; align-items: center; gap: 5px; padding: 1px 6px 0;
      font-size: 12px; font-weight: 800; letter-spacing: -.1px; color: var(--set-point);
    }
    .set-head::before {
      content: ''; width: 5px; height: 5px; border-radius: 50%;
      background: currentColor; flex: none; opacity: .85;
    }
    .set .card { box-shadow: none; flex: 1; display: flex; flex-direction: column; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 12px 11px 11px; min-width: 0; box-shadow: var(--shadow);
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 7px; }
    .card-title { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .card-title svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
    .card-title span { font-size: 14.5px; font-weight: 800; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .add-mini {
      width: 32px; height: 32px; border-radius: 10px; flex: none;
      border: 1px solid var(--line-strong); background: var(--card-2); color: var(--text);
      display: grid; place-items: center; cursor: pointer; padding: 0;
    }
    .add-mini svg { width: 17px; height: 17px; }
    .card-sum {
      font-size: 15.5px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 9px;
      font-variant-numeric: tabular-nums; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .card-sum.in { color: var(--in); }
    .card-sum.out { color: var(--out); }
    .card-sum.zero { color: var(--muted); }

    .item-list { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .item {
      background: var(--card-2); border: 1px solid transparent; border-radius: 12px;
      padding: 8px 9px 9px; cursor: pointer;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      transition: background .15s ease, border-color .15s ease, opacity .15s ease;
    }
    .item.paid .i-name { text-decoration: line-through; }
    .item.dragging {
      opacity: .82; border-color: var(--accent); background: var(--card);
      box-shadow: 0 14px 30px rgba(0,0,0,.2); position: relative; z-index: 25;
      transition: none; pointer-events: none;
    }
    .card[data-group="fixed"] .item-list {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start;
    }
    .card[data-group="fixed"] .item { min-width: 0; padding: 8px 7px 9px; }
    .card[data-group="fixed"] .i-top { gap: 4px; }
    .card[data-group="fixed"] .i-grip { width: 20px; height: 26px; }
    .card[data-group="fixed"] .i-grip svg { width: 15px; height: 19px; }
    .card[data-group="fixed"] .priv-edit { width: 24px; height: 24px; }
    .card[data-group="fixed"] .priv-edit svg { width: 14px; height: 14px; }
    .card[data-group="fixed"] .i-cat { font-size: 9.5px; padding: 1px 4px; margin-left: 3px; }
    .card[data-group="fixed"] .more-btn,
    .card[data-group="fixed"] .empty { grid-column: 1 / -1; }
    .i-top { display: flex; align-items: center; gap: 6px; }
    .chk {
      width: 20px; height: 20px; flex: none; padding: 0; border-radius: 6px;
      border: 1.5px solid var(--line-strong); background: transparent;
      color: var(--on-accent); display: grid; place-items: center; cursor: pointer;
    }
    .chk svg { width: 12px; height: 12px; stroke-width: 3; opacity: 0; }
    .chk.on { background: var(--accent); border-color: var(--accent); }
    .chk.on svg { opacity: 1; }
    .i-name {
      flex: 1; min-width: 0; font-size: 14px; font-weight: 700; letter-spacing: -.2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .i-cat {
      display: inline-block; margin-left: 5px; padding: 1px 6px;
      border-radius: 6px; font-size: 10.5px; font-weight: 700;
      background: var(--accent-soft); color: var(--accent-ink);
      vertical-align: 1px;
    }
    .i-grip {
      width: 26px; height: 28px; flex: none; display: grid; place-items: center;
      color: var(--muted); opacity: .75; touch-action: none; cursor: grab;
    }
    .i-grip svg { width: 17px; height: 21px; }
    .i-amt {
      font-size: 15.5px; font-weight: 800; letter-spacing: -.4px; margin-top: 0;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .i-amt.in { color: var(--in); }
    .i-amt.out { color: var(--out); }
    .i-amt.deferred, .tl-amt.deferred { color: var(--muted); }
    .i-sub {
      display: flex; align-items: baseline; justify-content: space-between; gap: 6px;
      margin-top: 4px;
    }
    .i-meta {
      font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 0;
      text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card[data-group="fixed"] .i-amt { font-size: 13.5px; }
    .card[data-group="fixed"] .i-meta { font-size: 10.5px; }
    .card.drop-over { border-color: var(--accent); background: var(--accent-soft); }
    .swipe-wrap { position: relative; overflow: hidden; border-radius: 12px; }
    .card[data-group="fixed"] .swipe-wrap { border-radius: 10px; }
    .swipe-wrap > .item,
    .swipe-wrap > .pitem {
      position: relative; z-index: 2;
      transition: transform .18s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
    }
    .swipe-wrap.swiping > .item,
    .swipe-wrap.swiping > .pitem { transition: none; }
    .swipe-wrap.swiped > .item,
    .swipe-wrap.swiped > .pitem { transform: translate3d(-50px, 0, 0); }
    .swipe-del {
      position: absolute; top: 0; right: 0; bottom: 0; width: 52px; z-index: 1;
      border: none; background: #E53935; color: #FFFFFF;
      display: grid; place-items: center; cursor: pointer; padding: 0;
      opacity: 0; pointer-events: none; transition: opacity .12s ease;
    }
    .swipe-wrap.swiping > .swipe-del,
    .swipe-wrap.swiped > .swipe-del {
      opacity: 1; pointer-events: auto;
    }
    .swipe-del svg { width: 17px; height: 17px; }
    .swipe-wrap.dragging-wrap { overflow: visible; z-index: 25; }
    .swipe-wrap.dragging-wrap > .swipe-del { display: none; }
    .priv-edit {
      width: 28px; height: 28px; flex: none; border: none; border-radius: 7px;
      background: transparent; color: var(--muted); display: grid; place-items: center;
      cursor: pointer; padding: 0;
    }
    .priv-edit svg { width: 16px; height: 16px; }
    .priv-edit:active { background: var(--line); }
    .empty { font-size: 13px; color: var(--muted); padding: 14px 2px; line-height: 1.45; }
    .empty button {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 10px;
      border: none; background: var(--accent-soft); color: var(--accent-ink);
      font-family: inherit; font-size: 13px; font-weight: 700;
      border-radius: 10px; padding: 7px 12px; cursor: pointer;
    }
    .empty button svg { width: 13px; height: 13px; }
    .more-btn {
      width: 100%; margin-top: 8px; padding: 10px 10px;
      border: 1px dashed var(--line-strong); border-radius: 12px;
      background: transparent; color: var(--muted);
      font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .more-btn:active { background: var(--card-2); }
    .lock-name { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
    .lock-name svg { width: 13px; height: 13px; flex: none; }

    .foot-hint { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.55; margin: 18px 0 0; }

    /* ---------- 날짜 흐름 ---------- */
    .flow { display: flex; flex-direction: column; gap: 12px; }
    .flow-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px; box-shadow: var(--shadow); }
    .flow-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .flow-stat { min-width: 0; }
    .flow-stat .k { font-size: 13px; color: var(--muted); font-weight: 600; }
    .flow-stat .v { font-size: 17px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.3px; }
    .flow-stat .v.neg { color: var(--warn); }
    .alert {
      margin-top: 14px; background: var(--warn-soft); color: var(--warn);
      border-radius: 14px; padding: 12px 14px; font-size: 13.5px; font-weight: 700; line-height: 1.45;
    }
    .start-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
    }
    .start-row label { font-size: 14px; font-weight: 700; color: var(--muted); }
    .start-input { position: relative; width: 144px; }
    .start-input input {
      width: 100%; padding: 10px 32px 10px 12px; text-align: right;
      border: 1px solid var(--line-strong); border-radius: 12px;
      background: var(--card-2); color: var(--text);
      font-family: inherit; font-size: 16px; font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .start-input span { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font-size: 14px; color: var(--muted); pointer-events: none; }
    .tl { margin-top: 16px; }
    .tl-row {
      display: flex; align-items: flex-start; gap: 9px; padding: 11px 0; border-top: 1px solid var(--line);
      cursor: pointer;
    }
    .tl-row .chk { margin-top: 4px; }
    .tl-mark {
      width: 5px; height: 22px; border-radius: 3px; flex: none; margin-top: 2px;
      background: var(--line-strong);
    }
    .tl-mark.in, .tl-mark.income { background: var(--mark-in); }
    .tl-mark.out, .tl-mark.expense { background: var(--mark-out); }
    .tl-row:first-child { border-top: none; padding-top: 2px; }
    .tl-row.day-start { border-top: 1px solid var(--line-strong); }
    .tl-row.paid { opacity: .48; }
    .tl-row.paid .tl-name { text-decoration: line-through; }
    .tl-day { width: 42px; flex: none; text-align: center; padding-top: 1px; }
    .tl-num { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; white-space: nowrap; }
    .tl-unit { font-size: 12px; color: var(--muted); line-height: 1.3; white-space: nowrap; }
    .tl-body { flex: 1; min-width: 0; }
    .tl-line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .tl-name { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.2px; }
    .tl-amt { font-size: 15px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
    .tl-amt.in { color: var(--in); }
    .tl-amt.out { color: var(--out); }
    .tl-sub { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 3px; }
    .tl-sub .grp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tl-bal { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tl-bal.neg { color: var(--warn); }
    .flow-empty { font-size: 14px; color: var(--muted); text-align: center; padding: 26px 0; }

    /* ---------- 구매예정 · 위시리스트 ---------- */
    .plan-sec {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 12px 12px 11px; margin-top: 10px; box-shadow: var(--shadow);
    }

    /* ---------- 연도·월 선택 ---------- */

    .year-row .yr { font-size: 17px; font-weight: 800; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }

      border-radius: 12px; padding: 13px 0; font-family: inherit; font-size: 14px; font-weight: 800;
      cursor: pointer; font-variant-numeric: tabular-nums;

    .month-grid button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

    /* ---------- 시트(모달) ---------- */
    .backdrop {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(12, 10, 11, .44);
      display: none; align-items: flex-end; justify-content: center;
    }
    .backdrop.open { display: flex; }
    .sheet {
      width: 100%; max-width: 520px; max-height: 93vh; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--card); color: var(--text);
      border-radius: 22px 22px 0 0; border-top: 1px solid var(--line);

    }
    @keyframes sheet-up { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
    .grab { width: 38px; height: 4px; border-radius: 99px; background: var(--line-strong); margin: 6px auto 12px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }

    .x-btn {
      width: 32px; height: 32px; border-radius: 10px; border: none; flex: none;

    .field { margin-bottom: 12px; }
    .field > label, .sub-label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; letter-spacing: -.1px; }
    .field input, .field select {
      width: 100%; padding: 12px; border: 1px solid var(--line-strong);
      border-radius: 12px; font-size: 16px; font-family: inherit;
      background: var(--card-2); color: var(--text);
      -webkit-appearance: none; appearance: none;
    }
    .field select {
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
      background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
      padding-right: 34px;
    }
    .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .field input:disabled { opacity: .65; }
    .switch:disabled { opacity: .5; }
    .money-input { position: relative; }
    .preset-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
    .preset-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--bg2); color: var(--fg);
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .preset-chip .p-del { font-size: 13px; line-height: 1; color: var(--muted); padding: 0 2px; }
    .preset-add {
      padding: 5px 10px; border-radius: 999px;

    }
    .money-input input { padding-right: 34px; font-variant-numeric: tabular-nums; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .switch-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--card-2); border: 1px solid var(--line); border-radius: 13px;
      padding: 11px 13px; margin-bottom: 12px; cursor: pointer;
    }
    .sw-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .sw-text b { font-size: 14px; font-weight: 700; letter-spacing: -.2px; }
    .sw-text small { font-size: 12px; color: var(--muted); line-height: 1.35; }
    .switch {
      -webkit-appearance: none; appearance: none; width: 46px; height: 27px; flex: none;
      border-radius: 999px; background: var(--line-strong); position: relative;
      margin: 0; cursor: pointer; transition: background .18s ease;
    }
    .switch::after {
      content: ''; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px;
      border-radius: 50%; background: var(--knob); transition: transform .18s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,.22);
    }
    .switch:checked { background: var(--accent); }
    .switch:checked::after { transform: translateX(19px); }

    #instInputs { display: none; }
    #instInputs.open { display: grid; }

    .hint-line { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 8px 2px 0; }
    .text-btn {
      border: none; background: transparent; color: var(--accent-ink);
      font-family: inherit; font-size: 13px; font-weight: 700;
      padding: 8px 0 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
    }
    #scopeField { margin-bottom: 4px; }
    #scopeField .seg { margin-bottom: 0; background: var(--card-2); }
    #scopeField .seg button.active { background: var(--accent); color: var(--on-accent); }

    .sheet-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 18px; }
    .sheet-actions.with-delete { grid-template-columns: .8fr .9fr 1.6fr; }
    .btn {
      padding: 14px 10px; border-radius: 13px; border: none;
      font-family: inherit; font-size: 15px; font-weight: 800; letter-spacing: -.2px; cursor: pointer;
    }
    .btn.primary { background: var(--accent); color: var(--on-accent); }
    .btn.ghost { background: var(--card-2); color: var(--text); }
    .btn.danger { background: var(--card-2); color: var(--warn); }

    /* ---------- 테마 선택 시트 ---------- */
    .theme-list { display: flex; flex-direction: column; gap: 8px; }
    .theme-opt {
      display: flex; align-items: center; gap: 12px; width: 100%;
      border: 1px solid var(--line); background: var(--card-2); color: var(--text);
      border-radius: 14px; padding: 13px 14px; font-family: inherit; cursor: pointer; text-align: left;
    }
    .theme-opt.active { border-color: var(--accent); }
    .swatch { width: 30px; height: 30px; border-radius: 10px; flex: none; border: 1px solid rgba(0,0,0,.14); }
    .swatch.mono { background: linear-gradient(135deg, #FFFFFF 50%, #0B0B0B 50%); }
    .swatch.pink { background: linear-gradient(135deg, #FBE3EA 50%, #D2547A 50%); }
    .swatch.dark { background: linear-gradient(135deg, #0B0B0D 50%, #2C2C33 50%); }
    .theme-opt .t { flex: 1; min-width: 0; }
    .theme-opt .t b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
    .theme-opt .t small { font-size: 12px; color: var(--muted); }
    .theme-opt .tick { width: 18px; height: 18px; color: var(--accent); opacity: 0; }
    .theme-opt.active .tick { opacity: 1; }

    .data-block { margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--line); }
    .data-block > .sub-label { margin-bottom: 4px; }
    .data-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .data-btns .btn { padding: 12px 8px; font-size: 13.5px; }
    .data-area {
      width: 100%; min-height: 96px; margin-top: 9px; padding: 10px;
      border: 1px solid var(--line-strong); border-radius: 12px;
      background: var(--card-2); color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px; line-height: 1.45; resize: vertical;
      -webkit-appearance: none; appearance: none;
    }
    .data-area:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translate(-50%, 12px); z-index: 80;
      background: #17171B; color: #FFFFFF; border-radius: 999px;
      padding: 10px 16px; font-size: 13px; font-weight: 700;
      opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
      max-width: 90vw; text-align: center;
    }
    body[data-theme="dark"] .toast { background: #F2F2F4; color: #0B0B0D; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 360px) {
      body { padding-left: 11px; padding-right: 11px; }
      .card { padding: 10px 9px; }
      .i-name { font-size: 12.5px; }
      .i-amt { font-size: 13px; }
      .i-meta { font-size: 11.5px; }
      .card-title span { font-size: 12.5px; }
    }
  </style>
</head>

          <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>

        <button class="theme-opt" data-theme-pick="pink" type="button">

          <span class="t"><b>연핑크</b><small>맑은 연핑크 · 아이보리 화이트</small></span>
          <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
        </button>
        <button class="theme-opt" data-theme-pick="dark" type="button">
          <span class="swatch dark" aria-hidden="true"></span>
          <span class="t"><b>다크 모노톤</b><small>블랙 · 차콜 배경 · 모노톤 아이콘</small></span>
          <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
        </button>

      <div class="data-block">

        <p class="hint-line" style="margin-top:0">브라우저나 홈 화면 앱을 바꾸면 내용이 따로 저장돼요. 아래 칸에 담아 다른 곳에서 불러오면 그대로 옮길 수 있어요.</p>
        <div class="data-btns">

  <!-- 연도·월 선택 시트 -->

  <!-- 구매예정·위시리스트 시트 -->
  <div class="backdrop" id="planBackdrop">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="planTitle">
      <div class="grab"></div>
      <div class="sheet-head">

        <button class="x-btn" id="planClose" aria-label="닫기">

      <div class="field">

        <label for="pAmount">금액 (선택)</label>

        </div>

        <label for="pMemo">메모 (선택)</label>
        <input id="pMemo" type="text" autocomplete="off" placeholder="예: 12월 세일 때" />

        <button class="btn ghost" id="planCancel">취소</button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    'use strict';

    /* =========================================================
       0. 기본 상수
       ========================================================= */
    var STORAGE_KEY = 'money_plan_v1';

    var CATS_FIXED = ['주거·관리', '통신', '구독', '교통', '할부', '이자', '원금', '저축·적금', '기타'];
    var CATS_MONTHLY = ['경조사비', '신용카드', '후불', '쇼핑', '식비·모임', '의료·미용', '기타'];
    var CATS_WINDFALL = ['당근', '용돈', '기타'];
    var CATS_PLAN = ['뷰티', '패션', '음식', '취미', '기타'];
    var CATS_POINT = ['기프트카드', '네이버 포인트', '기타'];

    var GROUPS = {
      income:   { title: '들어올 돈', type: 'income',  rec: true  },
      windfall: { title: '예상외 수입', type: 'income',  rec: false },
      fixed:    { title: '고정지출',   type: 'expense', rec: true  },
      monthly:  { title: '이번달 지출', type: 'expense', rec: false }
    };

    var GROUP_ICON = { income: 'arrowIn', windfall: 'sparkle', fixed: 'arrowOut', monthly: 'receipt' };

    var PLAN = {
      month: { title: '이번달 구매예정', icon: 'cart' },
      wish:  { title: '위시리스트', icon: 'star' }
    };

    var POINT = { title: '포인트구매', icon: 'gift' };

    var THEMES = {
      mono: { name: '화이트', meta: '#F3F3F3', dot: '#FFFFFF' },
      pink: { name: '핑크',   meta: '#FCF4F5', dot: '#E7A2B6' },
      dark: { name: '다크',   meta: '#0B0B0D', dot: '#26262C' }
    };

    var ICON = {
      wallet:  '<path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H18a2 2 0 0 1 2 2v1"/><rect x="3" y="8.5" width="18" height="10.5" rx="3"/><path d="M16.5 14h1.5"/>',
      plus:    '<path d="M12 5v14M5 12h14"/>',
      check:   '<path d="M4 12.5l5 5L20 6.5"/>',
      x:       '<path d="M6 6l12 12M18 6L6 18"/>',
      arrowIn: '<path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 20h14"/>',
      arrowOut:'<path d="M12 20V9"/><path d="M7.5 13.5L12 9l4.5 4.5"/><path d="M5 4h14"/>',
      cart:    '<path d="M2.8 4h2.3l2.1 10.2h11.1l1.9-7.2H6.2"/><circle cx="9.6" cy="19.2" r="1.3" fill="currentColor" stroke="none"/><circle cx="17.7" cy="19.2" r="1.3" fill="currentColor" stroke="none"/>',
      star:    '<path d="M12 3.8l2.5 5.1 5.6.8-4.1 4 1 5.6-5-2.6-5 2.6 1-5.6-4.1-4 5.6-.8z"/>',
      gift:    '<rect x="3.8" y="9.5" width="16.4" height="10.8" rx="2.2"/><path d="M3.8 13.6h16.4"/><path d="M12 9.5v10.8"/><path d="M12 9.5S9.8 9.5 8.7 8.4a2.35 2.35 0 0 1 3.3-3.3c1.1 1.1 0 4.4 0 4.4z"/><path d="M12 9.5s2.2 0 3.3-1.1a2.35 2.35 0 0 0-3.3-3.3c-1.1 1.1 0 4.4 0 4.4z"/>',
      swap:    '<path d="M8 20V5"/><path d="M4.5 8.5L8 5l3.5 3.5"/><path d="M16 4v15"/><path d="M12.5 15.5L16 19l3.5-3.5"/>',
      sparkle: '<path d="M12 3.5l1.7 4.9 4.8 1.6-4.8 1.6L12 16.5l-1.7-4.9L5.5 10l4.8-1.6z"/><path d="M18.5 15.5l.7 1.9 1.8.6-1.8.6-.7 1.9-.7-1.9-1.8-.6 1.8-.6z"/>',
      repeat:  '<path d="M4.5 10.5h11"/><path d="M12.5 7.5l3 3-3 3"/><path d="M19.5 13.5h-11"/><path d="M11.5 16.5l-3-3 3-3"/>',
      receipt: '<path d="M6 3.5h12v17l-2.4-1.6-2.4 1.6-2.4-1.6L8.4 20.5 6 18.9z"/><path d="M9 8.5h6M9 12h6"/>',
      lock:    '<rect x="5" y="11" width="14" height="9" rx="2.2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
      grip:    '<circle cx="9" cy="5.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="5.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="9" cy="18.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="18.5" r="1.4" fill="currentColor" stroke="none"/>'
    };

    function icon(name, size) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"' +
        (size ? ' width="' + size + '" height="' + size + '"' : '') + '>' + ICON[name] + '</svg>';
    }

    /* =========================================================
       1. 상태
       ========================================================= */
    var now = new Date();
    var viewYear = now.getMonth() === 11 ? now.getFullYear() + 1 : now.getFullYear();
    var viewMonth = (now.getMonth() + 1) % 12;

    var state = null;

    function monthKey(y, m) {
      return y + '-' + String(m + 1).padStart(2, '0');
    }
    function currentKey() {
      return monthKey(viewYear, viewMonth);
    }
    function keyToIndex(key) {
      var p = String(key).split('-');
      return Number(p[0]) * 12 + (Number(p[1]) - 1);
    }
    function monthDiff(fromKey, toKey) {
      return keyToIndex(toKey) - keyToIndex(fromKey);
    }
    function uid() {
      return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }
    function daysInMonth(y, m) {
      return new Date(y, m + 1, 0).getDate();
    }
    var WEEKDAY = ['일', '월', '화', '수', '목', '금', '토'];
    function weekdayOf(y, m, d) {
      if (!d || d < 1 || d > daysInMonth(y, m)) return '';
      return WEEKDAY[new Date(y, m, d).getDay()];
    }

    var nf = new Intl.NumberFormat('ko-KR');
    function num(n) { return nf.format(Math.round(Number(n) || 0)); }
    function won(n) { return num(n) + '원'; }
    function signedWon(n, type) {
      return (type === 'income' ? '+' : '-') + won(Math.abs(Number(n) || 0));
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function emptyState() {
      return {
        version: 3,
        recurring: [
          { id: 'r_seed_income', type: 'income', name: '월급 (예시)', amount: 2500000, day: 25, category: '수입' },
          { id: 'r_seed_phone', type: 'expense', name: '통신비 (예시)', amount: 45000, day: 15, category: '통신' }
        ],
        oneOff: {},
        overrides: {},
        paid: {},
        order: { global: { income: [], fixed: [] }, months: {} },
        startBal: {},
        purchases: {},
        wishlist: [],
        points: {},
        presets: { income: [], windfall: [], fixed: [], monthly: [] },
        theme: 'pink',
        view: 'cards'
      };
    }

    /* 구매예정·위시리스트 항목: 금액·메모는 비워도 됨 */
    function normPlanItem(raw) {
      if (!raw || typeof raw !== 'object') return null;
      var name = String(raw.name || '').trim();
      if (!name) return null;
      var item = {
        id: raw.id ? String(raw.id) : uid(),
        name: name.slice(0, 80),
        amount: Math.max(0, Math.round(Number(raw.amount) || 0)),
        memo: String(raw.memo == null ? '' : raw.memo).slice(0, 200),
        category: CATS_PLAN.indexOf(raw.category) >= 0 ? String(raw.category) : '',
        isPrivate: !!raw.isPrivate
      };
      return item;
    }

    /* 포인트구매 항목: 체크리스트라 완료 여부까지 저장 */
    function normPointItem(raw) {
      if (!raw || typeof raw !== 'object') return null;
      var name = String(raw.name || '').trim();
      if (!name) return null;
      return {
        id: raw.id ? String(raw.id) : uid(),
        name: name.slice(0, 80),
        amount: Math.max(0, Math.round(Number(raw.amount) || 0)),
        memo: String(raw.memo == null ? '' : raw.memo).slice(0, 200),
        category: CATS_POINT.indexOf(raw.category) >= 0 ? String(raw.category) : '기타',
        done: !!raw.done,
        isPrivate: !!raw.isPrivate
      };
    }

    function normPlanList(list) {
      return Array.isArray(list) ? list.map(normPlanItem).filter(Boolean) : [];
    }

    function normPointList(list) {
      return Array.isArray(list) ? list.map(normPointItem).filter(Boolean) : [];
    }

    /* --- 저장 데이터 정규화(마이그레이션) --- */
    function normCategory(type, cat) {
      if (type === 'income') {
        return CATS_WINDFALL.indexOf(cat) >= 0 ? cat : '수입';
      }
      if (cat === '통신·구독') return '구독';
      if (cat === '교통·생활') return '교통';
      if (CATS_FIXED.indexOf(cat) >= 0 || CATS_MONTHLY.indexOf(cat) >= 0) return cat;
      return '기타';
    }

    function normItem(raw) {
      if (!raw || typeof raw !== 'object') return null;
      var type = raw.type === 'income' ? 'income' : 'expense';
      var amount = Math.max(0, Math.round(Number(raw.amount) || 0));
      var day = Number(raw.day);
      if (!day || day < 1 || day > 31) day = null;
      var item = {
        id: raw.id ? String(raw.id) : uid(),
        type: type,
        name: String(raw.name || '이름 없음'),
        amount: amount,
        day: day,
        category: normCategory(type, raw.category),
        isPrivate: !!raw.isPrivate
      };
      if (raw.startMonth && /^\d{4}-\d{2}$/.test(String(raw.startMonth))) {
        item.startMonth = String(raw.startMonth);
      }
      if (raw.group && ['income', 'windfall', 'fixed', 'monthly'].indexOf(raw.group) !== -1) {
        item.group = raw.group;
      }
      var inst = raw.installment;
      if (inst && inst.startMonth && /^\d{4}-\d{2}$/.test(String(inst.startMonth))) {
        var startNo = Math.max(1, Math.round(Number(inst.startNo) || 1));
        var totalNo = Number(inst.totalNo);
        item.installment = {
          startMonth: String(inst.startMonth),
          startNo: startNo,
          totalNo: totalNo > 0 ? Math.round(totalNo) : null
        };
        if (type === 'expense' && !CATS_FIXED.includes(item.category)) item.category = '할부';
      }
      return item;
    }

    function loadState() {
      var raw = null;
      try {
        raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      } catch (e) { raw = null; }
      if (!raw || typeof raw !== 'object') return emptyState();
      return normalizeState(raw);
    }

    /* 저장된 JSON(또는 붙여넣은 백업) → 앱 상태 */
    function normalizeState(raw) {

      var s = emptyState();
      s.recurring = [];
      s.oneOff = {};

      if (Array.isArray(raw.recurring)) {
        raw.recurring.forEach(function (it) {
          var n = normItem(it);
          if (n) s.recurring.push(n);
        });
      }
      if (raw.oneOff && typeof raw.oneOff === 'object') {
        Object.keys(raw.oneOff).forEach(function (k) {
          if (!Array.isArray(raw.oneOff[k])) return;
          s.oneOff[k] = raw.oneOff[k].map(normItem).filter(Boolean);
        });
      }
      if (raw.paid && typeof raw.paid === 'object') s.paid = raw.paid;
      if (raw.overrides && typeof raw.overrides === 'object') s.overrides = raw.overrides;
      if (raw.startBal && typeof raw.startBal === 'object') s.startBal = raw.startBal;

      s.purchases = {};
      s.wishlist = [];
      if (raw.purchases && typeof raw.purchases === 'object') {
        Object.keys(raw.purchases).forEach(function (k) {
          if (!/^\d{4}-\d{2}$/.test(k)) return;
          var list = normPlanList(raw.purchases[k]);
          if (list.length) s.purchases[k] = list;
        });
      }
      if (Array.isArray(raw.wishlist)) s.wishlist = normPlanList(raw.wishlist);

      s.points = {};
      if (raw.points && typeof raw.points === 'object') {
        Object.keys(raw.points).forEach(function (k) {
          if (!/^\d{4}-\d{2}$/.test(k)) return;
          var plist = normPointList(raw.points[k]);
          if (plist.length) s.points[k] = plist;
        });
      }

      s.presets = { income: [], windfall: [], fixed: [], monthly: [] };
      if (raw.presets && typeof raw.presets === 'object') {
        ['income', 'windfall', 'fixed', 'monthly'].forEach(function (g) {
          if (Array.isArray(raw.presets[g])) {
            s.presets[g] = raw.presets[g]
              .map(function (t) { return String(t || '').trim().slice(0, 60); })
              .filter(function (t, i, arr) { return t && arr.indexOf(t) === i; })
              .slice(0, 20);
          }
        });
      }

      s.order = { global: { income: [], fixed: [] }, months: {} };
      if (raw.order && typeof raw.order === 'object') {
        if (raw.order.global && typeof raw.order.global === 'object') {
          if (Array.isArray(raw.order.global.income)) s.order.global.income = raw.order.global.income.slice();
          if (Array.isArray(raw.order.global.fixed)) s.order.global.fixed = raw.order.global.fixed.slice();
        }
        if (raw.order.months && typeof raw.order.months === 'object') {
          Object.keys(raw.order.months).forEach(function (k) {
            var m = raw.order.months[k];
            if (!m || typeof m !== 'object') return;
            var out = {};
            ['windfall', 'monthly', 'income', 'fixed'].forEach(function (g) {
              if (Array.isArray(m[g])) out[g] = m[g].slice();
            });
            s.order.months[k] = out;
          });
        }
      }

      s.theme = THEMES[raw.theme] ? raw.theme : 'pink';
      s.view = raw.view === 'flow' ? 'flow' : 'cards';
      return s;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    /* =========================================================
       2. 계산
       ========================================================= */
    function installmentState(item, key) {
      var inst = item.installment;
      if (!inst) return null;
      var diff = monthDiff(inst.startMonth, key);
      if (diff < 0) return { hidden: true };
      var no = inst.startNo + diff;
      if (inst.totalNo && no > inst.totalNo) return { hidden: true };
      return { no: no, totalNo: inst.totalNo || null, hidden: false };
    }

    function orderIds(group, key) {
      if (group === 'income' || group === 'fixed') {
        return state.order.global[group] || [];
      }
      var m = state.order.months[key];
      return (m && m[group]) || [];
    }

    function applyOrder(list, group, key) {
      var ids = orderIds(group, key);
      return list
        .map(function (x, i) { return { x: x, i: i, p: ids.indexOf(x.id) }; })
        .sort(function (a, b) {
          var ap = a.x.isPrivate ? 1 : 0;
          var bp = b.x.isPrivate ? 1 : 0;
          if (ap !== bp) return ap - bp;
          var pa = a.p < 0 ? Number.MAX_SAFE_INTEGER : a.p;
          var pb = b.p < 0 ? Number.MAX_SAFE_INTEGER : b.p;
          return pa - pb || a.i - b.i;
        })
        .map(function (o) { return o.x; });
    }

    function buildGroups(key) {
      var groups = { income: [], windfall: [], fixed: [], monthly: [] };
      var ov = state.overrides[key] || {};

      state.recurring.forEach(function (item) {
        if (item.startMonth && key < item.startMonth) return;
        var inst = installmentState(item, key);
        if (inst && inst.hidden) return;
        var o = ov[item.id];
        var group = item.type === 'income' ? 'income' : 'fixed';
        groups[group].push({
          id: item.id,
          base: item,
          recurring: true,
          type: item.type,
          name: o && o.name != null ? o.name : item.name,
          amount: o && o.amount != null ? Number(o.amount) : item.amount,
          day: o && o.day !== undefined ? o.day : item.day,
          category: o && o.category ? o.category : item.category,
          isPrivate: o && o.isPrivate !== undefined ? !!o.isPrivate : !!item.isPrivate,
          overridden: !!o,
          inst: inst
        });
      });

      (state.oneOff[key] || []).forEach(function (item) {
        var group = item.group || (item.type === 'income' ? 'windfall' : 'monthly');
        groups[group].push({
          id: item.id,
          base: item,
          recurring: false,
          type: item.type,
          name: item.name,
          amount: item.amount,
          day: item.day,
          category: item.category,
          isPrivate: !!item.isPrivate,
          overridden: false,
          inst: null
        });
      });

      ['income', 'windfall', 'fixed', 'monthly'].forEach(function (g) {
        groups[g] = applyOrder(groups[g], g, key);
      });
      return groups;
    }

    function isDeferredItem(it) {
      return !!(it && it.type === 'expense' && !it.recurring && it.category === '신용카드');
    }

    function sumOf(list) {
      return list.reduce(function (s, it) {
        if (isDeferredItem(it)) return s;
        return s + (Number(it.amount) || 0);
      }, 0);
    }

    /* =========================================================
       3. 렌더링
       ========================================================= */
    var el = {};

    function $(id) { return document.getElementById(id); }

    function cacheEls() {
      el.monthLabel = $('monthLabel');
      el.monthLabelBtn = $('monthLabelBtn');
      el.monthBadge = $('monthBadge');
      el.netBalance = $('netBalance');
      el.dailyBudget = $('dailyBudget');
      el.carryLine = $('carryLine');
      el.totalIncome = $('totalIncome');
      el.totalExpense = $('totalExpense');
      el.cardGrid = $('cardGrid');
      el.planWrap = $('planWrap');
      el.cardsView = $('cardsView');
      el.flowView = $('flowView');
      el.flowRoot = $('flowRoot');
      el.viewSeg = $('viewSeg');
      el.themeBtn = $('themeBtn');
      el.themeDot = $('themeDot');
      el.themeName = $('themeName');
      el.themeColorMeta = $('themeColorMeta');
      el.brandMark = document.querySelector('.brand-mark');
    }

    function prevMonthKey(key) {
      var parts = key.split('-');
      var y = Number(parts[0]), m = Number(parts[1]) - 2;
      if (m < 0) { y -= 1; m = 11; }
      return monthKey(y, m);
    }

    function getCarryAnchorKey() {
      var todayKey = monthKey(now.getFullYear(), now.getMonth());
      var anchor = todayKey;
      var pools = [state.oneOff || {}, state.overrides || {}, state.startBal || {}];
      pools.forEach(function (obj) {
        Object.keys(obj).forEach(function (k) {
          if (/^\d{4}-\d{2}$/.test(k) && k < anchor) anchor = k;
        });
      });
      return anchor;
    }

    function getStartBalance(key, memo) {
      memo = memo || {};
      if (memo[key]) return memo[key];
      var sbMap = state.startBal || {};
      if (Object.prototype.hasOwnProperty.call(sbMap, key) && sbMap[key] !== '' && sbMap[key] !== null && sbMap[key] !== undefined) {
        memo[key] = { value: Number(sbMap[key]) || 0, manual: true };
        return memo[key];
      }
      var anchor = getCarryAnchorKey();
      if (key <= anchor) {
        memo[key] = { value: 0, manual: false };
        return memo[key];
      }
      var pKey = prevMonthKey(key);
      var prevStart = getStartBalance(pKey, memo).value;
      var pg = buildGroups(pKey);
      var prevNet = sumOf(pg.income) + sumOf(pg.windfall) - sumOf(pg.fixed) - sumOf(pg.monthly);
      var carry = Math.max(0, prevStart + prevNet);
      memo[key] = { value: carry, manual: false };
      return memo[key];
    }

    function render() {
      document.body.dataset.theme = state.theme;
      el.themeColorMeta.setAttribute('content', THEMES[state.theme].meta);
      el.themeName.textContent = THEMES[state.theme].name;
      el.themeDot.style.background = THEMES[state.theme].dot;
      if (el.brandMark && !el.brandMark.firstChild) el.brandMark.innerHTML = icon('wallet');

      var key = currentKey();
      el.monthLabel.textContent = viewYear + '년 ' + (viewMonth + 1) + '월';

      var curIdx = now.getFullYear() * 12 + now.getMonth();
      var viewIdx = viewYear * 12 + viewMonth;
      var diff = viewIdx - curIdx;
      var badge = diff === 0 ? '이번 달' : diff === 1 ? '다음 달' : diff === -1 ? '지난 달'
        : (diff > 0 ? diff + '개월 뒤' : Math.abs(diff) + '개월 전');
      el.monthBadge.textContent = badge;

      var carryInfo = getStartBalance(key);
      var groups = buildGroups(key);
      var totalIn = sumOf(groups.income) + sumOf(groups.windfall);
      var totalOut = sumOf(groups.fixed) + sumOf(groups.monthly);
      var net = carryInfo.value + totalIn - totalOut;
      var days = daysInMonth(viewYear, viewMonth);

      el.netBalance.textContent = (net < 0 ? '-' : '') + won(Math.abs(net));
      var catEl = document.getElementById('meringCat');
      if (catEl) {
        var catSrc = net >= 200000 ? 'mering-cat.png'
          : net >= 100000 ? 'mering-cat-2.png'
          : net >= 0 ? 'mering-cat-3.png'
          : 'mering-cat-4.png';
        if (catEl.getAttribute('src') !== catSrc) catEl.setAttribute('src', catSrc);
      }
      el.totalIncome.textContent = '+' + won(totalIn);
      el.totalExpense.textContent = '-' + won(totalOut);

      if (carryInfo.value > 0 || carryInfo.manual) {
        el.carryLine.style.display = 'block';
        el.carryLine.textContent = (carryInfo.manual ? '월초 잔액(직접 입력) ' : '전달 이월 +') + won(carryInfo.value) + ' 포함';
      } else {
        el.carryLine.style.display = 'none';
      }

      if (net >= 0) {
        var perDay = Math.floor(net / days);
        el.dailyBudget.textContent = days + '일 기준 하루 약 ' + won(perDay) + '씩 쓸 수 있어요';
      } else {
        el.dailyBudget.textContent = '쓸 수 있는 돈보다 ' + won(Math.abs(net)) + ' 더 나가요';
      }

      var isCards = state.view === 'cards';
      el.cardsView.hidden = !isCards;
      el.flowView.hidden = isCards;
      Array.prototype.forEach.call(el.viewSeg.querySelectorAll('button'), function (b) {
        b.classList.toggle('active', b.dataset.view === state.view);
      });

      if (isCards) {
        el.cardGrid.innerHTML =
          '<div class="set set-a">' +
            '<div class="set-head">매달 반복</div>' +
            cardHTML('income', groups.income) +
            cardHTML('fixed', groups.fixed) +
          '</div>' +
          '<div class="set set-b">' +
            '<div class="set-head">이번 달만</div>' +
            cardHTML('windfall', groups.windfall) +
            cardHTML('monthly', groups.monthly) +
          '</div>';
        el.planWrap.innerHTML = planSectionHTML('month', key) + planSectionHTML('wish', key) + pointSectionHTML(key);
      } else {
        el.flowRoot.innerHTML = flowHTML(groups, key);
      }
    }

    var expandedGroups = {};
    var revealedIds = {};

    function cardHTML(group, list) {
      var meta = GROUPS[group];
      var total = sumOf(list);
      var sumClass = meta.type === 'income' ? 'in' : 'out';
      if (total === 0) sumClass = 'zero';

      var body;
      var limit = (group === 'fixed') ? 8 : 4;
      if (list.length) {
        var isExp = !!expandedGroups[group];
        var shown = (!isExp && list.length > limit) ? list.slice(0, limit) : list;
        body = shown.map(function (it) { return itemHTML(it, group); }).join('');
        if (list.length > limit) {
          body += '<button class="more-btn" type="button" data-more="' + group + '">' +
            (isExp ? '접기' : '+ ' + (list.length - limit) + '개 더보기') + '</button>';
        }
      } else {
        body = '<div class="empty">아직 없어요' +
          '<button type="button" data-add="' + group + '">' + icon('plus') + '추가하기</button></div>';
      }

      return '<section class="card" data-group="' + group + '">' +
        '<div class="card-head">' +
          '<h2 class="card-title">' + icon(GROUP_ICON[group]) + '<span>' + meta.title + '</span></h2>' +
          '<button class="add-mini" type="button" data-add="' + group + '" aria-label="' + meta.title + ' 추가">' + icon('plus') + '</button>' +
        '</div>' +
        '<div class="card-sum ' + sumClass + '">' + (total === 0 ? '0원' : signedWon(total, meta.type)) + '</div>' +
        '<div class="item-list" data-list="' + group + '">' + body + '</div>' +
      '</section>';
    }

    function itemMeta(it) {
      var parts = [];
      if (it.day) parts.push(it.day + '일');
      if (it.inst) parts.push(it.inst.totalNo ? (it.inst.no + '/' + it.inst.totalNo + '회차') : (it.inst.no + '회차'));
      if (it.overridden) parts.push('이번 달만');
      return parts.join(' · ');
    }

    var privEditSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    var trashSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';

    function itemHTML(it, group) {
      var paid = !!(state.paid[currentKey()] || {})[it.id];
      var isPriv = !!it.isPrivate;
      var locked = !!(isPriv && !revealedIds[it.id]);
      var catBadge = (!locked && it.category && (it.type === 'expense' || (group === 'windfall' && it.category !== '수입'))) ? '<span class="i-cat">' + esc(it.category) + '</span>' : '';
      var nameHtml = locked ? '<span class="lock-name">' + icon('lock', 12) + '비공개</span>' : (esc(it.name) + catBadge);
      var metaHtml = locked ? '눌러서 확인' : esc(itemMeta(it));
      var privEditBtn = (isPriv && !locked) ? '<button class="priv-edit" type="button" data-priv-edit="1" aria-label="수정">' + privEditSvg + '</button>' : '';
      var deferred = isDeferredItem(it);
      var amtHtml = '<div class="i-amt ' + (deferred ? 'deferred' : it.type) + '">' + (deferred ? '→ ' : '') + signedWon(it.amount, it.type) + '</div>';
      return '<div class="swipe-wrap">' +
        '<div class="item' + (paid ? ' paid' : '') + '" data-id="' + esc(it.id) + '" data-group="' + group + '"' + (isPriv ? ' data-private="1"' : '') + (locked ? ' data-locked="1"' : '') + ' role="button" tabindex="0">' +
          '<div class="i-top">' +
            '<button class="chk' + (paid ? ' on' : '') + '" type="button" data-check="' + esc(it.id) + '" aria-label="' + (paid ? '완료 취소' : '완료 표시') + '" aria-pressed="' + (paid ? 'true' : 'false') + '">' + icon('check') + '</button>' +
            '<span class="i-name">' + nameHtml + '</span>' +
            privEditBtn +
            '<span class="i-grip" data-handle="' + esc(it.id) + '" role="button" aria-label="순서 바꾸기" tabindex="-1">' + icon('grip') + '</span>' +
          '</div>' +
          '<div class="i-sub">' +
            amtHtml +
            '<div class="i-meta">' + metaHtml + '</div>' +
          '</div>' +
        '</div>' +
        '<button class="swipe-del" type="button" data-del="' + esc(it.id) + '" aria-label="삭제">' + trashSvg + '</button>' +
      '</div>';
    }

    function planList(section, key) {
      var raw = section === 'wish' ? (state.wishlist || []) : ((state.purchases || {})[key] || []);
      return raw.filter(function (x) { return !x.isPrivate; }).concat(raw.filter(function (x) { return !!x.isPrivate; }));
    }

    function planTotal(list) {
      return list.reduce(function (s, it) { return s + (Number(it.amount) || 0); }, 0);
    }

    function planItemHTML(it, section, i) {
      var isPriv = !!it.isPrivate;
      var locked = !!(isPriv && !revealedIds[it.id]);
      var catBadge = (!locked && it.category) ? '<span class="i-cat">' + esc(it.category) + '</span>' : '';
      var nameHtml = locked ? '<span class="lock-name">' + icon('lock', 12) + '비공개</span>' : (esc(it.name) + catBadge);
      var memoHtml = locked ? '<div class="p-memo">눌러서 확인</div>' : (it.memo ? '<div class="p-memo">' + esc(it.memo) + '</div>' : '');
      var privEditBtn = (isPriv && !locked) ? '<button class="priv-edit" type="button" data-priv-edit="1" aria-label="수정">' + privEditSvg + '</button>' : '';
      return '<div class="swipe-wrap">' +
        '<div class="pitem" data-pid="' + esc(it.id) + '" data-sec="' + section + '"' + (isPriv ? ' data-private="1"' : '') + (locked ? ' data-locked="1"' : '') + ' role="button" tabindex="0">' +
          '<span class="p-rank">' + (i + 1) + '.</span>' +
          '<div class="p-body">' +
            '<div class="p-line">' +
              '<span class="p-name">' + nameHtml + '</span>' +
              '<span class="p-amt">' + won(it.amount) + '</span>' +
            '</div>' +
            memoHtml +
          '</div>' +
          privEditBtn +
          '<button class="p-move" type="button" data-pmove="' + esc(it.id) + '" aria-label="' +
            (section === 'wish' ? '이번달 구매예정으로 옮기기' : '위시리스트로 옮기기') + '">' + icon('swap') + '</button>' +
          '<span class="p-grip" data-pgrip="' + esc(it.id) + '" role="button" aria-label="순서 바꾸기" tabindex="-1">' + icon('grip') + '</span>' +
        '</div>' +
        '<button class="swipe-del" type="button" data-pdel="' + esc(it.id) + '" aria-label="삭제">' + trashSvg + '</button>' +
      '</div>';
    }

    function planSectionHTML(section, key) {
      var meta = PLAN[section];
      var list = planList(section, key);
      var total = planTotal(list);
      var mKey = 'plan_' + section;
      var isExp = !!expandedGroups[mKey];
      var shown = (!isExp && list.length > 4) ? list.slice(0, 4) : list;
      var body = list.length
        ? shown.map(function (it, i) { return planItemHTML(it, section, i); }).join('') +
          (list.length > 4 ? '<button class="more-btn" type="button" data-more="' + mKey + '">' + (isExp ? '접기' : '+ ' + (list.length - 4) + '개 더보기') + '</button>' : '')
        : '<div class="plan-empty">' +
            (section === 'month' ? '이 달에 살 것을 적어 두세요' : '나중에 살 것을 모아 두세요') + '</div>';

      return '<section class="plan-sec" data-sec="' + section + '">' +
        '<div class="plan-head">' +
          '<h2 class="plan-title">' + icon(meta.icon) + '<span>' + meta.title + '</span></h2>' +
          '<div class="plan-right">' +
            '<span class="plan-sum">' + (list.length ? '합계 ' + won(total) : '0원') + '</span>' +
            '<button class="add-mini" type="button" data-plan-add="' + section + '" aria-label="' + meta.title + ' 추가">' + icon('plus') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="plan-list" data-plan-list="' + section + '">' + body + '</div>' +
      '</section>';
    }

    /* --- 포인트구매(체크리스트 · 월별 · 금액 합계 제외) --- */
    function pointList(key) {
      var raw = (state.points || {})[key] || [];
      return raw.filter(function (x) { return !x.isPrivate; }).concat(raw.filter(function (x) { return !!x.isPrivate; }));
    }

    function pointItemHTML(it) {
      var isPriv = !!it.isPrivate;
      var locked = !!(isPriv && !revealedIds[it.id]);
      var catBadge = (!locked && it.category) ? '<span class="i-cat">' + esc(it.category) + '</span>' : '';
      var nameHtml = locked ? '<span class="lock-name">' + icon('lock', 12) + '비공개</span>' : (esc(it.name) + catBadge);
      var memoHtml = locked ? '<div class="p-memo">눌러서 확인</div>' : (it.memo ? '<div class="p-memo">' + esc(it.memo) + '</div>' : '');
      var privEditBtn = (isPriv && !locked) ? '<button class="priv-edit" type="button" data-priv-edit="1" aria-label="수정">' + privEditSvg + '</button>' : '';
      return '<div class="swipe-wrap">' +
        '<div class="pitem' + (it.done ? ' done' : '') + '" data-pid="' + esc(it.id) + '" data-sec="point"' + (isPriv ? ' data-private="1"' : '') + (locked ? ' data-locked="1"' : '') + ' role="button" tabindex="0">' +
          '<button class="chk' + (it.done ? ' on' : '') + '" type="button" data-pcheck="' + esc(it.id) + '" aria-label="' + (it.done ? '구매 취소' : '구매 완료') + '" aria-pressed="' + (it.done ? 'true' : 'false') + '">' + icon('check') + '</button>' +
          '<div class="p-body">' +
            '<div class="p-line">' +
              '<span class="p-name">' + nameHtml + '</span>' +
              (it.amount ? '<span class="p-amt">' + won(it.amount) + '</span>' : '') +
            '</div>' +
            memoHtml +
          '</div>' +
          privEditBtn +
          '<span class="p-grip" data-pgrip="' + esc(it.id) + '" role="button" aria-label="순서 바꾸기" tabindex="-1">' + icon('grip') + '</span>' +
        '</div>' +
        '<button class="swipe-del" type="button" data-pdel="' + esc(it.id) + '" aria-label="삭제">' + trashSvg + '</button>' +
      '</div>';
    }

    function pointSectionHTML(key) {
      var list = pointList(key);
      var isExp = !!expandedGroups.point;
      var shown = (!isExp && list.length > 4) ? list.slice(0, 4) : list;
      var doneCount = list.filter(function (x) { return !!x.done; }).length;
      var body = list.length
        ? shown.map(pointItemHTML).join('') +
          (list.length > 4 ? '<button class="more-btn" type="button" data-point-more="1">' + (isExp ? '접기' : '+ ' + (list.length - 4) + '개 더보기') + '</button>' : '')
        : '<div class="plan-empty">포인트로 살 것을 체크리스트로 적어 두세요</div>';

      return '<section class="plan-sec" data-sec="point">' +
        '<div class="plan-head">' +
          '<h2 class="plan-title">' + icon(POINT.icon) + '<span>' + POINT.title + '</span></h2>' +
          '<div class="plan-right">' +
            (list.length ? '<span class="point-count">' + doneCount + '/' + list.length + '</span>' : '') +
            '<button class="add-mini" type="button" data-point-add="1" aria-label="' + POINT.title + ' 추가">' + icon('plus') + '</button>' +
          '</div>' +
        '</div>' +
        '<div class="point-hint">체크해서 하나씩 사면 돼요 · 위 금액 계산에는 들어가지 않아요</div>' +
        '<div class="plan-list" data-point-list="' + key + '">' + body + '</div>' +
      '</section>';
    }

    function flowHTML(groups, key) {
      var seq = { income: 0, windfall: 1, fixed: 2, monthly: 3 };
      var all = [];
      ['income', 'windfall', 'fixed', 'monthly'].forEach(function (gk) {
        groups[gk].forEach(function (it, i) {
          all.push({ it: it, gk: gk, seq: seq[gk] * 10000 + i });
        });
      });

      all.sort(function (a, b) {
        var da = a.it.day || 99;
        var db = b.it.day || 99;
        if (da !== db) return da - db;
        if (a.it.type !== b.it.type) return a.it.type === 'income' ? -1 : 1;
        return a.seq - b.seq;
      });

      var paidMap = state.paid[key] || {};
      var carryInfo = getStartBalance(key);
      var startBal = carryInfo.value;
      var bal = startBal;
      var minBal = startBal;
      var minDay = null;
      var rows = '';
      var prevDay = null;

      all.forEach(function (row) {
        var it = row.it;
        var deferred = isDeferredItem(it);
        if (!deferred) {
          bal += it.type === 'income' ? it.amount : -it.amount;
          if (bal < minBal) { minBal = bal; minDay = it.day; }
        }

        var d = it.day || 99;
        var isNewDay = prevDay !== null && d !== prevDay;
        prevDay = d;
        var paid = !!paidMap[it.id];
        var wd = weekdayOf(viewYear, viewMonth, it.day);

        var isPriv = !!it.isPrivate;
        var locked = !!(isPriv && !revealedIds[it.id]);
        rows += '<div class="tl-row' + (paid ? ' paid' : '') + (isNewDay ? ' day-start' : '') + '" data-id="' + esc(it.id) + '" data-group="' + row.gk + '"' + (isPriv ? ' data-private="1"' : '') + (locked ? ' data-locked="1"' : '') + ' role="button" tabindex="0">' +
          '<button class="chk' + (paid ? ' on' : '') + '" type="button" data-check="' + esc(it.id) + '" aria-label="' + (paid ? '완료 취소' : '완료 표시') + '" aria-pressed="' + (paid ? 'true' : 'false') + '">' + icon('check') + '</button>' +
          '<span class="tl-mark ' + it.type + '" aria-hidden="true"></span>' +
          '<div class="tl-day"><div class="tl-num">' + (it.day ? it.day + '일' : '–') + '</div><div class="tl-unit">' + (it.day ? (wd ? '(' + wd + ')' : '') : '미정') + '</div></div>' +
          '<div class="tl-body">' +
            '<div class="tl-line">' +
              '<span class="tl-name">' + (locked ? '<span class="lock-name">' + icon('lock', 12) + '비공개</span>' : esc(it.name)) + '</span>' +
              '<span class="tl-amt ' + (deferred ? 'deferred' : it.type) + '">' + (deferred ? '→ ' : '') + signedWon(it.amount, it.type) + '</span>' +
            '</div>' +
            '<div class="tl-sub">' +
              '<span class="grp">' + (locked ? '눌러서 확인' : esc(GROUPS[row.gk].title + (it.inst ? ' · ' + (it.inst.totalNo ? it.inst.no + '/' + it.inst.totalNo + '회차' : it.inst.no + '회차') : '') + (it.overridden ? ' · 이번 달만' : ''))) + '</span>' +
              '<span class="tl-bal' + (bal < 0 ? ' neg' : '') + '">잔액 ' + (bal < 0 ? '-' : '') + won(Math.abs(bal)) + '</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      });

      var finalBal = bal;
      var alertHTML = '';
      if (minBal < 0) {
        alertHTML = '<div class="alert">' + (minDay ? minDay + '일 무렵' : '월 중') +
          ' 잔액이 ' + won(Math.abs(minBal)) + ' 모자라요.' +
          (startBal === 0 ? ' 월초 잔액을 넣으면 실제 흐름을 더 정확히 볼 수 있어요.' : ' 지출 날짜를 뒤로 미루거나 금액을 조정해 보세요.') + '</div>';
      } else if (all.length) {
        alertHTML = '<div class="alert" style="background:var(--accent-soft);color:var(--accent-ink)">' +
          '이 달은 잔액이 마이너스로 내려가지 않아요.</div>';
      }

      var head = '<div class="flow-card">' +
        '<div class="flow-stats">' +
          '<div class="flow-stat"><div class="k">월말 잔액</div><div class="v' + (finalBal < 0 ? ' neg' : '') + '">' + (finalBal < 0 ? '-' : '') + won(Math.abs(finalBal)) + '</div></div>' +
          '<div class="flow-stat"><div class="k">가장 낮은 잔액</div><div class="v' + (minBal < 0 ? ' neg' : '') + '">' + (minBal < 0 ? '-' : '') + won(Math.abs(minBal)) + (minDay ? ' <span style="font-size:12px;font-weight:600;color:var(--muted)">(' + minDay + '일)</span>' : '') + '</div></div>' +
        '</div>' +
        '<div class="start-row">' +
          '<label for="fStartBal">월초 잔액' + (!carryInfo.manual && startBal > 0 ? ' <span style="font-size:11px;font-weight:700;color:var(--accent-ink)">(자동 이월)</span>' : '') + '</label>' +
          '<div class="start-input"><input id="fStartBal" type="text" inputmode="numeric" autocomplete="off" value="' + (startBal ? num(startBal) : '') + '" placeholder="0" /><span>원</span></div>' +
        '</div>' +
        alertHTML +
        '</div>';

      var body = all.length
        ? '<div class="flow-card"><div class="tl">' + rows + '</div></div>'
        : '<div class="flow-card"><div class="flow-empty">이 달에 표시할 수입·지출이 없어요</div></div>';

      return head + body;
    }

    /* =========================================================
       4. 토스트
       ========================================================= */
    var toastTimer = null;
    function toast(msg) {
      var t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1900);
    }

    /* =========================================================
       5. 완료 체크
       ========================================================= */
    function togglePaid(id) {
      var key = currentKey();
      state.paid[key] = state.paid[key] || {};
      state.paid[key][id] = !state.paid[key][id];
      if (!state.paid[key][id]) delete state.paid[key][id];
      saveState();
      render();
    }

    /* =========================================================
       6. 편집 시트
       ========================================================= */
    var ed = null;

    function findEntry(id, key) {
      for (var i = 0; i < state.recurring.length; i++) {
        if (state.recurring[i].id === id) {
          return { base: state.recurring[i], recurring: true, group: state.recurring[i].type === 'income' ? 'income' : 'fixed' };
        }
      }
      var list = state.oneOff[key] || [];
      for (var j = 0; j < list.length; j++) {
        if (list[j].id === id) {
          return { base: list[j], recurring: false, group: list[j].group || (list[j].type === 'income' ? 'windfall' : 'monthly') };
        }
      }
      return null;
    }

    function openEditor(opts) {
      var key = currentKey();
      var entry = null;
      if (opts.mode === 'edit') {
        entry = findEntry(opts.id, key);
        if (!entry) return;
      }

      ed = {
        mode: opts.mode,
        group: opts.group || (entry ? entry.group : 'income'),
        id: opts.id || null,
        scope: 'month',
        type: null,
        recurring: false
      };

      var fName = $('fName'), fAmount = $('fAmount'), fDay = $('fDay');

      if (opts.mode === 'add') {
        var g = GROUPS[ed.group];
        ed.type = g.type;
        ed.recurring = g.rec;
        $('edTitle').textContent = g.title + ' 추가';
        fName.value = '';
        fAmount.value = '';
        fDay.value = '';
        $('fRecurring').checked = g.rec;
        $('fInstall').checked = false;
        $('fInstNo').value = '';
        $('fInstTotal').value = '';
        $('fPrivate').checked = false;
        $('repeatField').style.display = '';
        $('scopeField').style.display = 'none';
        ed.initialCategory = '';
        updateRepeatHint();
      } else {
        var it = entry.base;
        var ov = (state.overrides[key] || {})[it.id];
        ed.type = it.type;
        ed.recurring = entry.recurring;
        $('edTitle').textContent = '항목 수정';
        fName.value = ov && ov.name != null ? ov.name : it.name;
        fAmount.value = num(ov && ov.amount != null ? ov.amount : it.amount);
        fDay.value = (ov && ov.day !== undefined ? ov.day : it.day) || '';
        $('repeatField').style.display = 'none';
        $('fRecurring').checked = entry.recurring;
        $('fPrivate').checked = !!(ov && ov.isPrivate !== undefined ? ov.isPrivate : it.isPrivate);
        $('scopeField').style.display = entry.recurring ? '' : 'none';
        ed.initialCategory = ov && ov.category ? ov.category : it.category;

        if (it.installment) {
          $('fInstall').checked = true;
          var diff = monthDiff(it.installment.startMonth, key);
          var thisNo = Math.max(1, it.installment.startNo + diff);
          $('fInstNo').value = String(thisNo);
          $('fInstTotal').value = it.installment.totalNo ? String(it.installment.totalNo) : '';
        } else {
          $('fInstall').checked = false;
          $('fInstNo').value = '';
          $('fInstTotal').value = '';
        }
        ed.scope = 'month';
      }

      $('edDelete').style.display = opts.mode === 'edit' ? '' : 'none';
      $('sheetActions').className = 'sheet-actions' + (opts.mode === 'edit' ? ' with-delete' : '');

      ['fInstall', 'fInstNo', 'fInstTotal'].forEach(function (id) { $(id).disabled = false; });
      $('instField').style.opacity = '';

      updateCategoryOptions();
      updateScopeUI();
      updateInstallmentUI();
      renderPresets();

      var bd = $('sheetBackdrop');
      bd.classList.add('open');
      document.body.classList.add('locked');
      setTimeout(function () {
        try { $('fName').focus(); } catch (e) {}
      }, 120);
    }

    function updateRepeatHint() {
      var hint = $('repeatHint');
      if (!hint) return;
      var rec = $('fRecurring').checked;
      var m = (viewMonth + 1) + '월';
      if (ed.type === 'income') {
        if (rec) hint.textContent = m + '부터 매달 들어오는 돈이에요 (들어올 돈)';
        else if (ed.group === 'income') hint.textContent = m + ' 들어올 돈에만 들어가요';
        else hint.textContent = m + '에만 들어오는 돈이에요 (예상외 수입)';
      } else {
        hint.textContent = rec ? m + '부터 매달 나가는 돈이에요 (고정지출)' : m + '에만 나가는 지출이에요 (이번달 지출)';
      }
    }

    function presetGroupKey() {
      if (!ed) return 'income';
      if (ed.group) return ed.group;
      return ed.type === 'income' ? (isRecurringNow() ? 'income' : 'windfall') : (isRecurringNow() ? 'fixed' : 'monthly');
    }

    function renderPresets() {
      var bar = $('namePresets');
      if (!bar || !ed) return;
      var gk = presetGroupKey();
      var list = (state.presets && state.presets[gk]) ? state.presets[gk] : [];
      var html = list.map(function (t, idx) {
        return '<span class="preset-chip" data-preset-idx="' + idx + '">' +
          '<span>' + esc(t) + '</span>' +
          '<span class="p-del" data-preset-del="' + idx + '" role="button" aria-label="저장된 이름 삭제">×</span>' +
        '</span>';
      }).join('');
      html += '<button class="preset-add" type="button" id="savePresetBtn">+ 이 이름 저장</button>';
      bar.innerHTML = html;
    }

    function isRecurringNow() {
      if (ed.mode === 'edit') return !!ed.recurring;
      return $('fRecurring').checked;
    }

    function updateCategoryOptions(preferred) {
      var catField = $('catField');
      var select = $('fCategory');
      if (ed.type === 'income' && ed.group !== 'windfall') {
        catField.style.display = 'none';
        select.innerHTML = '<option value="수입">수입</option>';
        return;
      }
      catField.style.display = 'block';
      var list = ed.type === 'income' ? CATS_WINDFALL : (isRecurringNow() ? CATS_FIXED : CATS_MONTHLY);
      var want = preferred != null ? preferred : (ed.initialCategory != null ? ed.initialCategory : select.value);
      ed.initialCategory = null;
      select.innerHTML = list.map(function (c) {
        return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
      }).join('');
      select.value = list.indexOf(want) >= 0 ? want : list[0];
    }

    function updateInstallmentUI() {
      var visible = ed.type === 'expense' && isRecurringNow();
      $('instField').style.display = visible ? '' : 'none';
      if (!visible) $('fInstall').checked = false;
      var on = visible && $('fInstall').checked;
      $('instInputs').classList.toggle('open', on);
      if (on) {
        var sel = $('fCategory');
        if (sel.querySelector('option[value="할부"]')) sel.value = '할부';
      }
    }

    function updateScopeUI() {
      var scopeField = $('scopeField');
      if (ed.mode !== 'edit' || !ed.recurring) {
        scopeField.style.display = 'none';
        return;
      }
      scopeField.style.display = '';
      var key = currentKey();
      var entry = findEntry(ed.id, key);
      var base = entry ? entry.base : null;
      var ov = (state.overrides[key] || {})[ed.id];

      Array.prototype.forEach.call($('scopeSeg').querySelectorAll('button'), function (b) {
        b.classList.toggle('active', b.dataset.scope === ed.scope);
      });

      var hint = $('scopeHint');
      if (ed.scope === 'month') {
        hint.textContent = '이번 달(' + (viewMonth + 1) + '월)에만 적용돼요. 기본값은 ' +
          (base ? won(base.amount) + ' · ' + (base.day ? base.day + '일' : '날짜 미정') : '-') + ' 그대로예요.';
      } else {
        hint.textContent = '지금부터 모든 달에 적용돼요' +
          (ov ? '. 이번 달에만 넣은 수정은 사라져요.' : '.');
      }

      var reset = $('resetOverride');
      reset.style.display = ov ? '' : 'none';

      // 이번 달만 수정할 때는 할부 설정(기본값)을 잠그다
      var lock = ed.scope === 'month';
      ['fInstall', 'fInstNo', 'fInstTotal'].forEach(function (id) {
        $(id).disabled = lock;
      });
      $('instField').style.opacity = lock ? '.55' : '';
    }

    function closeEditor() {
      $('sheetBackdrop').classList.remove('open');
      document.body.classList.remove('locked');
      ed = null;
    }

    function readAmount(id) {
      var v = $(id).value.replace(/[^\d]/g, '');
      return v ? Number(v) : 0;
    }

    function saveEditor() {
      if (!ed) return;

      var name = $('fName').value.trim();
      var amount = readAmount('fAmount');
      var dayRaw = $('fDay').value.replace(/[^\d]/g, '');
      var day = dayRaw ? Math.min(31, Math.max(1, Number(dayRaw))) : null;
      var recurring = $('fRecurring').checked;
      var key = currentKey();

      if (!name) { toast('이름을 입력해 주세요'); try { $('fName').focus(); } catch (e) {} return; }
      if (!amount) { toast('금액을 입력해 주세요'); try { $('fAmount').focus(); } catch (e) {} return; }

      var category = ed.type === 'expense' ? $('fCategory').value : '수입';

      /* --- 추가 --- */
      if (ed.mode === 'add') {
        var group;
        if (ed.type === 'income') group = recurring ? 'income' : 'windfall';
        else group = recurring ? 'fixed' : 'monthly';

        var item = {
          id: uid(),
          type: ed.type,
          name: name,
          amount: amount,
          day: day,
          category: category,
          isPrivate: $('fPrivate').checked
        };

        if (ed.type === 'expense' && recurring && $('fInstall').checked) {
          var noRaw = $('fInstNo').value.replace(/[^\d]/g, '');
          var totalRaw = $('fInstTotal').value.replace(/[^\d]/g, '');
          item.installment = {
            startMonth: key,
            startNo: noRaw ? Math.max(1, Number(noRaw)) : 1,
            totalNo: totalRaw ? Math.max(1, Number(totalRaw)) : null
          };
          item.category = '할부';
        } else if (ed.type === 'expense' && recurring && category === '할부') {
          item.category = '할부';
        }

        if (recurring) {
          item.startMonth = key;
          state.recurring.push(item);
          var gk = ed.type === 'income' ? 'income' : 'fixed';
          state.order.global[gk] = (state.order.global[gk] || []).concat([item.id]);
        } else {
          var mk = ed.type === 'income' ? (ed.group === 'income' ? 'income' : 'windfall') : 'monthly';
          item.group = mk;
          state.oneOff[key] = state.oneOff[key] || [];
          state.oneOff[key].push(item);
          state.order.months[key] = state.order.months[key] || {};
          state.order.months[key][mk] = (state.order.months[key][mk] || []).concat([item.id]);
        }

        saveState();
        closeEditor();
        render();
        toast('추가했어요');
        return;
      }

      /* --- 수정 --- */
      var entry = findEntry(ed.id, key);
      if (!entry) { closeEditor(); return; }
      var base = entry.base;

      if (entry.recurring && ed.scope === 'month') {
        state.overrides[key] = state.overrides[key] || {};
        state.overrides[key][base.id] = {
          name: name, amount: amount, day: day, category: category, isPrivate: $('fPrivate').checked
        };
        saveState();
        closeEditor();
        render();
        toast('이번 달에만 적용했어요');
        return;
      }

      base.name = name;
      base.amount = amount;
      base.day = day;
      base.category = category;
      base.isPrivate = $('fPrivate').checked;

      if (entry.recurring) {
        if (base.type === 'expense' && $('fInstall').checked) {
          var noRaw2 = $('fInstNo').value.replace(/[^\d]/g, '');
