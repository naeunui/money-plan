          var totalRaw2 = $('fInstTotal').value.replace(/[^\d]/g, '');
          var inst = base.installment;
          var anchorMonth = inst ? inst.startMonth : key;
          var anchorNo = inst ? inst.startNo : 1;
          var diff = monthDiff(anchorMonth, key);
          var entered = noRaw2 ? Math.max(1, Number(noRaw2)) : 1;
          var newStartNo = entered - diff;
          if (newStartNo < 1) { anchorMonth = key; newStartNo = entered; }
          base.installment = {
            startMonth: anchorMonth,
            startNo: newStartNo,
            totalNo: totalRaw2 ? Math.max(1, Number(totalRaw2)) : null
          };
          base.category = '할부';
        } else {
          delete base.installment;
          if (base.category === '할부') base.category = '기타';
        }
        // 기본값을 바꾸면 이번 달 override는 정리하고, 다른 달 override의 비공개 여부도 동기화
        if (state.overrides[key]) {
          delete state.overrides[key][base.id];
          if (!Object.keys(state.overrides[key]).length) delete state.overrides[key];
        }
        Object.keys(state.overrides).forEach(function (ok) {
          if (state.overrides[ok] && state.overrides[ok][base.id]) {
            state.overrides[ok][base.id].isPrivate = base.isPrivate;
          }
        });
      }

      saveState();
      closeEditor();
      render();
      toast('수정했어요');
    }

    function deleteCurrent() {
      if (!ed || ed.mode !== 'edit') return;
      var key = currentKey();
      var entry = findEntry(ed.id, key);
      if (!entry) { closeEditor(); return; }
      var base = entry.base;

      var msg = entry.recurring
        ? '"' + base.name + '"은(는) 매달 반복되는 항목이에요.\n모든 달에서 삭제할까요?'
        : '"' + base.name + '"을(를) 이번 달에서 삭제할까요?';
      if (!window.confirm(msg)) return;

      if (entry.recurring) {
        state.recurring = state.recurring.filter(function (x) { return x.id !== base.id; });
      } else {
        state.oneOff[key] = (state.oneOff[key] || []).filter(function (x) { return x.id !== base.id; });
      }
      removeFromOrder(base.id);
      if (state.overrides[key]) delete state.overrides[key][base.id];
      Object.keys(state.paid).forEach(function (k) {
        if (state.paid[k] && state.paid[k][base.id]) delete state.paid[k][base.id];
      });

      saveState();
      closeEditor();
      render();
      toast('삭제했어요');
    }

    function deleteItemById(id) {
      var entry = findEntry(id);
      if (!entry) return;
      var key = currentKey();
      if (entry.recurring) {
        state.recurring = state.recurring.filter(function (x) { return x.id !== id; });
      } else {
        state.oneOff[key] = (state.oneOff[key] || []).filter(function (x) { return x.id !== id; });
      }
      removeFromOrder(id);
      if (state.overrides[key]) delete state.overrides[key][id];
      Object.keys(state.paid).forEach(function (k) {
        if (state.paid[k] && state.paid[k][id]) delete state.paid[k][id];
      });
      saveState();
      render();
      toast('삭제했어요');
    }

    function removeFromOrder(id) {
      ['income', 'fixed'].forEach(function (g) {
        state.order.global[g] = (state.order.global[g] || []).filter(function (x) { return x !== id; });
      });
      Object.keys(state.order.months).forEach(function (k) {
        var m = state.order.months[k];
        Object.keys(m).forEach(function (g) {
          m[g] = (m[g] || []).filter(function (x) { return x !== id; });
        });
      });
    }

    /* =========================================================
       7. 드래그 정렬 (Pointer / Touch)
       ========================================================= */
    var drag = null;
    var suppressClickUntil = 0;

    function afterElement(container, x, y, dragged) {
      var els = Array.prototype.slice.call(container.querySelectorAll('.swipe-wrap'));
      var isGrid = container.dataset.list === 'fixed';
      if (isGrid) {
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          if (el === dragged) continue;
          var r = el.getBoundingClientRect();
          if (y < r.top) return el;
          if (y <= r.bottom && x < r.left + r.width / 2) return el;
        }
        return null;
      }
      var best = null;
      var bestOffset = -Infinity;
      els.forEach(function (el) {
        if (el === dragged) return;
        var r = el.getBoundingClientRect();
        var offset = y - r.top - r.height / 2;
        if (offset < 0 && offset > bestOffset) {
          bestOffset = offset;
          best = el;
        }
      });
      return best;
    }

    function floatFollow(el, clientX, clientY, trackX) {
      el.style.transform = '';
      var r = el.getBoundingClientRect();
      var dx = trackX ? (clientX - (r.left + r.width / 2)) : 0;
      var dy = clientY - (r.top + r.height / 2);
      el.style.transform = 'translate3d(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px,0) scale(1.03)';
    }

    function startDrag(item, clientX, clientY, pointerId, captureEl) {
      var wrap = item.closest('.swipe-wrap') || item;
      wrap.classList.remove('swiped');
      wrap.classList.add('dragging-wrap');
      drag = {
        item: item,
        wrap: wrap,
        startX: clientX,
        startY: clientY,
        pointerId: pointerId,
        moved: false,
        group: item.dataset.group,
        container: wrap.parentElement
      };
      item.classList.add('dragging');
      wrap.style.transform = 'scale(1.03)';
      if (captureEl && captureEl.setPointerCapture) {
        try { captureEl.setPointerCapture(pointerId); } catch (e) {}
      }
    }

    function moveDrag(clientX, clientY) {
      if (!drag) return;
      if (Math.hypot(clientX - drag.startX, clientY - drag.startY) > 3) drag.moved = true;
      var after = afterElement(drag.container, clientX, clientY, drag.wrap);
      var more = drag.container.querySelector('.more-btn');
      if (after === null) {
        if (more) drag.container.insertBefore(drag.wrap, more);
        else drag.container.appendChild(drag.wrap);
      } else if (after !== drag.wrap) {
        drag.container.insertBefore(drag.wrap, after);
      }
      floatFollow(drag.wrap, clientX, clientY, drag.group === 'fixed');
    }

    function endDrag() {
      if (!drag) return;
      var d = drag;
      drag = null;
      d.item.classList.remove('dragging');
      d.wrap.classList.remove('dragging-wrap');
      d.wrap.style.transform = '';
      suppressClickUntil = Date.now() + 320;
      if (!d.moved) return;
      var ids = Array.prototype.slice.call(d.container.querySelectorAll('.item')).map(function (el) {
        return el.dataset.id;
      });
      saveOrder(d.group, ids);
    }

    function saveOrder(group, ids) {
      if (group === 'income' || group === 'fixed') {
        state.order.global[group] = ids;
      } else {
        var key = currentKey();
        state.order.months[key] = state.order.months[key] || {};
        state.order.months[key][group] = ids;
      }
      saveState();
      render();
    }

    function closeAllSwipes(except) {
      Array.prototype.forEach.call(document.querySelectorAll('.swipe-wrap.swiped'), function (w) {
        if (w !== except) w.classList.remove('swiped');
      });
    }

    function bindPointer() {
      var hold = null;
      var sw = null;
      var clearHold = function () {
        if (hold) { clearTimeout(hold.timer); hold = null; }
      };

      el.cardGrid.addEventListener('pointerdown', function (e) {
        if (e.target.closest('[data-del]')) return;
        var handle = e.target.closest('[data-handle]');
        if (handle) {
          var hItem = handle.closest('.item');
          if (!hItem) return;
          e.preventDefault();
          closeAllSwipes();
          startDrag(hItem, e.clientX, e.clientY, e.pointerId, handle);
          return;
        }
        if (e.target.closest('[data-check]') || e.target.closest('[data-priv-edit]')) return;
        var item = e.target.closest('.item');
        if (!item) return;
        var wrap = item.closest('.swipe-wrap');
        closeAllSwipes(wrap);
        clearHold();
        var pid = e.pointerId, sx = e.clientX, sy = e.clientY;
        var baseDx = (wrap && wrap.classList.contains('swiped')) ? -50 : 0;
        sw = { item: item, wrap: wrap, pid: pid, sx: sx, sy: sy, baseDx: baseDx, dx: baseDx, active: false };
        hold = {
          pointerId: pid,
          x: sx,
          y: sy,
          timer: setTimeout(function () {
            hold = null;
            sw = null;
            startDrag(item, sx, sy, pid, item);
          }, 230)
        };
      }, { passive: false });

      document.addEventListener('pointermove', function (e) {
        if (hold && e.pointerId === hold.pointerId) {
          if (Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 8) clearHold();
        }
        if (sw && e.pointerId === sw.pid && !drag) {
          var mdx = e.clientX - sw.sx;
          var mdy = e.clientY - sw.sy;
          if (!sw.active && Math.abs(mdx) > 8 && Math.abs(mdx) > Math.abs(mdy) * 1.2) {
            sw.active = true;
            clearHold();
            if (sw.wrap) sw.wrap.classList.add('swiping');
          }
          if (sw.active) {
            if (e.cancelable) e.preventDefault();
            var nx = Math.max(-56, Math.min(0, sw.baseDx + mdx));
            sw.dx = nx;
            sw.item.style.transform = 'translate3d(' + nx.toFixed(1) + 'px,0,0)';
          }
        }
        if (!drag || e.pointerId !== drag.pointerId) return;
        if (e.cancelable) e.preventDefault();
        moveDrag(e.clientX, e.clientY);
      }, { passive: false });

      var finishSwipe = function (e) {
        if (hold && e.pointerId === hold.pointerId) clearHold();
        if (sw && e.pointerId === sw.pid) {
          var s = sw;
          sw = null;
          if (s.wrap) s.wrap.classList.remove('swiping');
          s.item.style.transform = '';
          if (s.active) {
            if (s.wrap) s.wrap.classList.toggle('swiped', s.dx < -24);
            suppressClickUntil = Date.now() + 260;
          } else if (s.baseDx < 0 && s.wrap) {
            s.wrap.classList.remove('swiped');
            suppressClickUntil = Date.now() + 260;
          }
        }
      };

      document.addEventListener('pointerup', function (e) {
        finishSwipe(e);
        if (!drag || e.pointerId !== drag.pointerId) return;
        endDrag();
      });
      document.addEventListener('pointercancel', function (e) {
        finishSwipe(e);
        if (!drag || e.pointerId !== drag.pointerId) return;
        endDrag();
      });

      // PointerEvent 미지원(구형 iOS) 폴백
      if (!window.PointerEvent) {
        var touchId = null;
        el.cardGrid.addEventListener('touchstart', function (e) {
          var handle = e.target.closest('[data-handle]');
          if (!handle) return;
          var t = e.changedTouches[0];
          var item = handle.closest('.item');
          if (!item) return;
          touchId = t.identifier;
          startDrag(item, t.clientX, t.clientY, 'touch', null);
        }, { passive: true });

        document.addEventListener('touchmove', function (e) {
          if (!drag || drag.pointerId !== 'touch') return;
          for (var i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === touchId) {
              moveDrag(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
              if (e.cancelable) e.preventDefault();
              break;
            }
          }
        }, { passive: false });

        document.addEventListener('touchend', function () {
          if (!drag || drag.pointerId !== 'touch') return;
          endDrag();
          touchId = null;
        });
      }
    }

    /* =========================================================
       7-B. 연도·월 점프
       ========================================================= */
    var pickerYear = null;

    function renderMonthPicker() {
      $('pickerYear').textContent = pickerYear + '년';
      var grid = '';
      for (var m = 0; m < 12; m++) {
        var on = pickerYear === viewYear && m === viewMonth;
        var isToday = pickerYear === now.getFullYear() && m === now.getMonth();
        grid += '<button type="button" data-pick-month="' + m + '" class="' +
          (on ? 'on' : '') + (isToday ? ' today' : '') + '">' + (m + 1) + '월</button>';
      }
      $('monthGrid').innerHTML = grid;
    }

    function openMonthPicker() {
      pickerYear = viewYear;
      renderMonthPicker();
      $('monthBackdrop').classList.add('open');
      document.body.classList.add('locked');
    }

    function closeMonthPicker() {
      $('monthBackdrop').classList.remove('open');
      document.body.classList.remove('locked');
    }

    function jumpToMonth(y, m) {
      viewYear = y;
      viewMonth = m;
      revealedIds = {};
      render();
    }

    /* =========================================================
       7-C. 구매예정 · 위시리스트
       ========================================================= */
    var ped = null;

    function planItemById(id) {
      var key = currentKey();
      var ml = (state.purchases || {})[key] || [];
      for (var i = 0; i < ml.length; i++) if (ml[i].id === id) return { item: ml[i], section: 'month' };
      var wl = state.wishlist || [];
      for (var j = 0; j < wl.length; j++) if (wl[j].id === id) return { item: wl[j], section: 'wish' };
      var pl = (state.points || {})[key] || [];
      for (var k = 0; k < pl.length; k++) if (pl[k].id === id) return { item: pl[k], section: 'point' };
      return null;
    }

    function planRemoveItem(id) {
      var key = currentKey();
      var ml = (state.purchases || {})[key] || [];
      for (var i = 0; i < ml.length; i++) {
        if (ml[i].id !== id) continue;
        var out = ml.splice(i, 1)[0];
        if (!ml.length) delete state.purchases[key];
        return out;
      }
      var wl = state.wishlist || [];
      for (var j = 0; j < wl.length; j++) {
        if (wl[j].id !== id) continue;
        return wl.splice(j, 1)[0];
      }
      var pl = (state.points || {})[key] || [];
      for (var k = 0; k < pl.length; k++) {
        if (pl[k].id !== id) continue;
        var pout = pl.splice(k, 1)[0];
        if (!pl.length) delete state.points[key];
        return pout;
      }
      return null;
    }

    function planAppendItem(section, item) {
      var key = currentKey();
      if (section === 'point') {
        state.points = state.points || {};
        state.points[key] = (state.points[key] || []).concat([item]);
      } else if (section === 'wish') {
        state.wishlist = (state.wishlist || []).concat([item]);
      } else {
        state.purchases = state.purchases || {};
        state.purchases[key] = (state.purchases[key] || []).concat([item]);
      }
    }

    function movePlanItem(id, section, silent) {
      var found = planItemById(id);
      if (!found) return;
      var target = section || (found.section === 'wish' ? 'month' : 'wish');
      if (target === found.section) return;
      var removed = planRemoveItem(id);
      if (!removed) return;
      planAppendItem(target, removed);
      saveState();
      render();
      if (!silent) toast(target === 'wish' ? '위시리스트로 옮겼어요' : '이번달 구매예정으로 옮겼어요');
    }

    function openPlanEditor(opts) {
      var found = opts.mode === 'edit' ? planItemById(opts.id) : null;
      if (opts.mode === 'edit' && !found) return;
      ped = {
        mode: opts.mode,
        section: opts.section || (found ? found.section : 'month'),
        id: opts.id || null
      };
      $('planTitle').textContent = ped.mode === 'add'
        ? (ped.section === 'point' ? POINT.title + ' 추가' : PLAN[ped.section].title + ' 추가')
        : (ped.section === 'point' ? '포인트 항목 수정' : '구매 항목 수정');
      $('pName').value = found ? found.item.name : '';
      $('pAmount').value = found && found.item.amount ? num(found.item.amount) : '';
      $('pMemo').value = found ? found.item.memo : '';
      $('pPrivate').checked = found ? !!found.item.isPrivate : false;
      $('planCatField').style.display = '';
      updatePlanCatOptions(found ? found.item.category : '');
      $('planScopeField').style.display = ped.section === 'point' ? 'none' : '';
      $('planDelete').style.display = ped.mode === 'edit' ? '' : 'none';
      $('planActions').className = 'sheet-actions' + (ped.mode === 'edit' ? ' with-delete' : '');
      updatePlanScopeUI();
      $('planBackdrop').classList.add('open');
      document.body.classList.add('locked');
      setTimeout(function () {
        try { $('pName').focus(); } catch (e) {}
      }, 120);
    }

    function updatePlanCatOptions(value) {
      var sel = $('pCategory');
      if (!sel) return;
      var isPoint = !!(ped && ped.section === 'point');
      var list = isPoint ? CATS_POINT : CATS_PLAN;
      var html = isPoint ? '' : '<option value="">분류 없음</option>';
      html += list.map(function (c) {
        return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
      }).join('');
      sel.innerHTML = html;
      if (list.indexOf(value) >= 0) sel.value = value;
      else sel.value = isPoint ? '기타' : '';
    }

    function updatePlanScopeUI() {
      if (!ped) return;
      Array.prototype.forEach.call($('planScopeSeg').querySelectorAll('button'), function (b) {
        b.classList.toggle('active', b.dataset.planScope === ped.section);
      });
      $('planScopeHint').textContent = ped.section === 'month'
        ? '이번 달(' + (viewMonth + 1) + '월)에만 보여요.'
        : '어느 달에서나 계속 보여요.';
    }

    function closePlanEditor() {
      $('planBackdrop').classList.remove('open');
      document.body.classList.remove('locked');
      ped = null;
    }

    function savePlanEditor() {
      if (!ped) return;
      var name = $('pName').value.trim();
      var amount = readAmount('pAmount');
      var memo = $('pMemo').value.trim();
      var isPriv = $('pPrivate').checked;
      var category = $('pCategory').value || '';
      if (!name) { toast('이름을 입력해 주세요'); try { $('pName').focus(); } catch (e) {} return; }
      var section = ped.section;

      if (section === 'point') {
        if (CATS_POINT.indexOf(category) < 0) category = '기타';
        if (ped.mode === 'add') {
          planAppendItem('point', {
            id: uid(), name: name, amount: amount, memo: memo, category: category, done: false, isPrivate: isPriv
          });
        } else {
          var pfound = planItemById(ped.id);
          if (!pfound) { closePlanEditor(); return; }
          pfound.item.name = name;
          pfound.item.amount = amount;
          pfound.item.memo = memo;
          pfound.item.category = category;
          pfound.item.isPrivate = isPriv;
        }
      } else if (ped.mode === 'add') {
        planAppendItem(section, { id: uid(), name: name, amount: amount, memo: memo, category: CATS_PLAN.indexOf(category) >= 0 ? category : '', isPrivate: isPriv });
      } else {
        var found = planItemById(ped.id);
        if (!found) { closePlanEditor(); return; }
        found.item.name = name;
        found.item.amount = amount;
        found.item.memo = memo;
        found.item.category = CATS_PLAN.indexOf(category) >= 0 ? category : '';
        found.item.isPrivate = isPriv;
        if (found.section !== section) movePlanItem(ped.id, section, true);
      }
      saveState();
      closePlanEditor();
      render();
      toast('저장했어요');
    }

    /* 포인트구매 체크 */
    function togglePointDone(id) {
      var key = currentKey();
      var list = (state.points || {})[key] || [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].id !== id) continue;
        list[i].done = !list[i].done;
        saveState();
        render();
        return;
      }
    }

    function deletePlanItem() {
      if (!ped || ped.mode !== 'edit') return;
      var found = planItemById(ped.id);
      if (!found) { closePlanEditor(); return; }
      if (!window.confirm('"' + found.item.name + '"을(를) 삭제할까요?')) return;
      planRemoveItem(ped.id);
      saveState();
      closePlanEditor();
      render();
      toast('삭제했어요');
    }

    /* --- 구매예정 ↔ 위시리스트 드래그 --- */
    var pdrag = null;

    function planListUnder(clientY) {
      var lists = el.planWrap.querySelectorAll('.plan-list[data-plan-list]');
      var best = null;
      var bestDist = Infinity;
      for (var i = 0; i < lists.length; i++) {
        var r = lists[i].getBoundingClientRect();
        if (clientY >= r.top - 14 && clientY <= r.bottom + 14) return lists[i];
        var dist = Math.abs(clientY - (r.top + r.bottom) / 2);
        if (dist < bestDist) { bestDist = dist; best = lists[i]; }
      }
      return best;
    }

    function planAfterElement(list, y, dragged) {
      var els = Array.prototype.slice.call(list.querySelectorAll('.swipe-wrap')).filter(function (x) { return x !== dragged; });
      for (var i = 0; i < els.length; i++) {
        var r = els[i].getBoundingClientRect();
        if (y < r.top + r.height / 2) return els[i];
      }
      return null;
    }

    function isOverMonthOut(x, y) {
      var card = el.cardGrid.querySelector('.card[data-group="monthly"]');
      if (!card) return null;
      var r = card.getBoundingClientRect();
      return (x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= r.bottom + 8) ? card : null;
    }

    function startPlanDrag(item, clientX, clientY, pointerId, captureEl) {
      var wrap = item.closest('.swipe-wrap') || item;
      wrap.classList.remove('swiped');
      wrap.classList.add('dragging-wrap');
      pdrag = {
        item: item,
        wrap: wrap,
        startX: clientX,
        startY: clientY,
        pointerId: pointerId,
        moved: false,
        from: item.dataset.sec,
        toMonthOut: false
      };
      item.classList.add('dragging');
      wrap.style.transform = 'scale(1.03)';
      if (captureEl && captureEl.setPointerCapture) {
        try { captureEl.setPointerCapture(pointerId); } catch (e) {}
      }
    }

    function movePlanDrag(clientX, clientY) {
      if (!pdrag) return;
      if (Math.hypot(clientX - pdrag.startX, clientY - pdrag.startY) > 3) pdrag.moved = true;

      /* 포인트구매는 그 목록 안에서만 순서를 바꿈 */
      if (pdrag.from === 'point') {
        var plist = el.planWrap.querySelector('.plan-list[data-point-list]');
        if (!plist) return;
        var el2 = planAfterElement(plist, clientY, pdrag.wrap);
        if (el2) plist.insertBefore(pdrag.wrap, el2);
        else plist.appendChild(pdrag.wrap);
        floatFollow(pdrag.wrap, clientX, clientY, true);
        return;
      }

      var moCard = isOverMonthOut(clientX, clientY);
      var allMo = el.cardGrid.querySelector('.card[data-group="monthly"]');
      if (allMo) allMo.classList.toggle('drop-over', !!moCard);
      pdrag.toMonthOut = !!moCard;
      if (moCard) {
        Array.prototype.forEach.call(el.planWrap.querySelectorAll('.plan-list[data-plan-list]'), function (l) {
          l.classList.remove('drop-over');
        });
        floatFollow(pdrag.wrap, clientX, clientY, true);
        return;
      }
      var list = planListUnder(clientY);
      if (!list) return;
      Array.prototype.forEach.call(el.planWrap.querySelectorAll('.plan-list[data-plan-list]'), function (l) {
        l.classList.toggle('drop-over', l === list);
      });
      if (pdrag.wrap.parentElement !== list) list.appendChild(pdrag.wrap);
      var after = planAfterElement(list, clientY, pdrag.wrap);
      if (after) list.insertBefore(pdrag.wrap, after);
      else list.appendChild(pdrag.wrap);
      floatFollow(pdrag.wrap, clientX, clientY, true);
    }

    function endPlanDrag() {
      if (!pdrag) return;
      var d = pdrag;
      pdrag = null;
      d.item.classList.remove('dragging');
      d.wrap.classList.remove('dragging-wrap');
      d.wrap.style.transform = '';
      suppressClickUntil = Date.now() + 320;
      var allMo = el.cardGrid.querySelector('.card[data-group="monthly"]');
      if (allMo) allMo.classList.remove('drop-over');
      Array.prototype.forEach.call(el.planWrap.querySelectorAll('.plan-list[data-plan-list]'), function (l) {
        l.classList.remove('drop-over');
      });
      if (!d.moved) return;

      /* 포인트구매: 목록 안 순서만 저장 */
      if (d.from === 'point') {
        var key = currentKey();
        var plist = el.planWrap.querySelector('.plan-list[data-point-list]');
        if (!plist) return;
        var pids = Array.prototype.slice.call(plist.querySelectorAll('.pitem')).map(function (x) { return x.dataset.pid; });
        var pmap = {};
        ((state.points || {})[key] || []).forEach(function (it) { pmap[it.id] = it; });
        var ordered = pids.map(function (id) { return pmap[id]; }).filter(Boolean);
        ((state.points || {})[key] || []).forEach(function (it) {
          if (pids.indexOf(it.id) < 0) ordered.push(it);
        });
        if (ordered.length) state.points[key] = ordered;
        saveState();
        render();
        return;
      }

      if (d.toMonthOut) {
        var pid = d.item.dataset.pid;
        var found = planItemById(pid);
        if (found) {
          var mkey = currentKey();
          planRemoveItem(pid);
          state.oneOff[mkey] = state.oneOff[mkey] || [];
          var newId = uid();
          state.oneOff[mkey].push({
            id: newId,
            type: 'expense',
            name: found.item.name,
            amount: found.item.amount,
            day: null,
            category: '쇼핑',
            isPrivate: !!found.item.isPrivate
          });
          state.order.months[mkey] = state.order.months[mkey] || {};
          state.order.months[mkey].monthly = state.order.months[mkey].monthly || [];
          state.order.months[mkey].monthly.push(newId);
          saveState();
          render();
          toast('이번달 지출로 옮겼어요');
        }
        return;
      }

      var parentList = d.wrap.closest ? d.wrap.closest('.plan-list') : d.wrap.parentElement;
      var target = parentList ? parentList.dataset.planList : d.from;
      var idsOf = function (sec) {
        var l = el.planWrap.querySelector('[data-plan-list="' + sec + '"]');
        if (!l) return [];
        return Array.prototype.slice.call(l.querySelectorAll('.pitem')).map(function (x) { return x.dataset.pid; });
      };
      var monthIds = idsOf('month');
      var wishIds = idsOf('wish');

      var key = currentKey();
      var map = {};
      ((state.purchases || {})[key] || []).concat(state.wishlist || []).forEach(function (it) { map[it.id] = it; });
      var monthList = monthIds.map(function (id) { return map[id]; }).filter(Boolean);
      var wishList = wishIds.map(function (id) { return map[id]; }).filter(Boolean);
      ((state.purchases || {})[key] || []).forEach(function (it) {
        if (monthIds.indexOf(it.id) < 0 && wishIds.indexOf(it.id) < 0) monthList.push(it);
      });
      (state.wishlist || []).forEach(function (it) {
        if (monthIds.indexOf(it.id) < 0 && wishIds.indexOf(it.id) < 0) wishList.push(it);
      });
      if (monthList.length) state.purchases[key] = monthList;
      else delete state.purchases[key];
      state.wishlist = wishList;

      saveState();
      render();
      if (target !== d.from) {
        toast(target === 'wish' ? '위시리스트로 옮겼어요' : '이번달 구매예정으로 옮겼어요');
      }
    }

    function bindPlanPointer() {
      var phold = null;
      var psw = null;
      var clearPHold = function () {
        if (phold) { clearTimeout(phold.timer); phold = null; }
      };

      el.planWrap.addEventListener('pointerdown', function (e) {
        if (e.target.closest('[data-pdel]') || e.target.closest('[data-pcheck]')) return;
        var handle = e.target.closest('[data-pgrip]');
        if (handle) {
          var hItem = handle.closest('.pitem');
          if (!hItem) return;
          e.preventDefault();
          closeAllSwipes();
          startPlanDrag(hItem, e.clientX, e.clientY, e.pointerId, handle);
          return;
        }
        if (e.target.closest('[data-pmove]') || e.target.closest('[data-priv-edit]')) return;
        var item = e.target.closest('.pitem');
        if (!item) return;
        var wrap = item.closest('.swipe-wrap');
        closeAllSwipes(wrap);
        clearPHold();
        var pid = e.pointerId, sx = e.clientX, sy = e.clientY;
        var baseDx = (wrap && wrap.classList.contains('swiped')) ? -50 : 0;
        psw = { item: item, wrap: wrap, pid: pid, sx: sx, sy: sy, baseDx: baseDx, dx: baseDx, active: false };
        phold = {
          pointerId: pid,
          x: sx,
          y: sy,
          timer: setTimeout(function () {
            phold = null;
            psw = null;
            startPlanDrag(item, sx, sy, pid, item);
          }, 230)
        };
      }, { passive: false });

      document.addEventListener('pointermove', function (e) {
        if (phold && e.pointerId === phold.pointerId) {
          if (Math.hypot(e.clientX - phold.x, e.clientY - phold.y) > 8) clearPHold();
        }
        if (psw && e.pointerId === psw.pid && !pdrag) {
          var mdx = e.clientX - psw.sx;
          var mdy = e.clientY - psw.sy;
          if (!psw.active && Math.abs(mdx) > 8 && Math.abs(mdx) > Math.abs(mdy) * 1.2) {
            psw.active = true;
            clearPHold();
            if (psw.wrap) psw.wrap.classList.add('swiping');
          }
          if (psw.active) {
            if (e.cancelable) e.preventDefault();
            var nx = Math.max(-56, Math.min(0, psw.baseDx + mdx));
            psw.dx = nx;
            psw.item.style.transform = 'translate3d(' + nx.toFixed(1) + 'px,0,0)';
          }
        }
        if (!pdrag || e.pointerId !== pdrag.pointerId) return;
        if (e.cancelable) e.preventDefault();
        movePlanDrag(e.clientX, e.clientY);
      }, { passive: false });

      var finishPSwipe = function (e) {
        if (phold && e.pointerId === phold.pointerId) clearPHold();
        if (psw && e.pointerId === psw.pid) {
          var s = psw;
          psw = null;
          if (s.wrap) s.wrap.classList.remove('swiping');
          s.item.style.transform = '';
          if (s.active) {
            if (s.wrap) s.wrap.classList.toggle('swiped', s.dx < -24);
            suppressClickUntil = Date.now() + 260;
          } else if (s.baseDx < 0 && s.wrap) {
            s.wrap.classList.remove('swiped');
            suppressClickUntil = Date.now() + 260;
          }
        }
      };

      document.addEventListener('pointerup', function (e) {
        finishPSwipe(e);
        if (!pdrag || e.pointerId !== pdrag.pointerId) return;
        endPlanDrag();
      });
      document.addEventListener('pointercancel', function (e) {
        finishPSwipe(e);
        if (!pdrag || e.pointerId !== pdrag.pointerId) return;
        endPlanDrag();
      });

      if (!window.PointerEvent) {
        var touchId = null;
        el.planWrap.addEventListener('touchstart', function (e) {
          var handle = e.target.closest('[data-pgrip]');
          if (!handle) return;
          var item = handle.closest('.pitem');
          if (!item) return;
          var t = e.changedTouches[0];
          touchId = t.identifier;
          startPlanDrag(item, t.clientX, t.clientY, 'touch', null);
        }, { passive: true });

        document.addEventListener('touchmove', function (e) {
          if (!pdrag || pdrag.pointerId !== 'touch') return;
          for (var i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === touchId) {
              if (e.cancelable) e.preventDefault();
              movePlanDrag(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
              break;
            }
          }
        }, { passive: false });

        document.addEventListener('touchend', function () {
          if (!pdrag || pdrag.pointerId !== 'touch') return;
          endPlanDrag();
          touchId = null;
        });
      }
    }

    /* =========================================================
       7-D. 데이터 내보내기 · 불러오기
       ========================================================= */
    function exportData() {
      var json = JSON.stringify(state);
      var area = $('dataArea');
      area.value = json;
      try { area.focus(); area.select(); } catch (e) {}
      var done = function () { toast('복사했어요. 다른 곳에 붙여넣으세요'); };
      var fail = function () { toast('아래 칸의 내용을 길게 눌러 복사하세요'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(json).then(done, function () {
          try {
            if (document.execCommand('copy')) done(); else fail();
          } catch (e) { fail(); }
        });
      } else {
        try {
          if (document.execCommand('copy')) done(); else fail();
        } catch (e) { fail(); }
      }
    }

    function importData() {
      var raw = $('dataArea').value.trim();
      if (!raw) { toast('붙여넣은 내용이 없어요'); return; }
      var parsed = null;
      try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        toast('데이터 형식이 아니에요');
        return;
      }
      var ours = ['recurring', 'oneOff', 'overrides', 'purchases', 'wishlist', 'points', 'startBal', 'order', 'theme', 'view']
        .some(function (k) { return Object.prototype.hasOwnProperty.call(parsed, k); });
      if (!ours) { toast('머랭 데이터가 아니에요'); return; }

      var next = normalizeState(parsed);
      var stock = next.recurring.length + (next.wishlist || []).length;
      Object.keys(next.purchases || {}).forEach(function (k) { stock += next.purchases[k].length; });
      Object.keys(next.points || {}).forEach(function (k) { stock += next.points[k].length; });
      if (!window.confirm('지금 내용을 붙여넣은 데이터로 바꿀까요?\n(기존 내용은 덮어써져요 · 항목 ' + stock + '개)')) return;

      state = next;
      saveState();
      render();
      toast('불러왔어요');
    }

    /* =========================================================
       8. 이벤트 연결
       ========================================================= */
    function bindEvents() {
      $('prevMonth').addEventListener('click', function () {
        viewMonth--;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        revealedIds = {};
        render();
      });
      $('nextMonth').addEventListener('click', function () {
        viewMonth++;
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        revealedIds = {};
        render();
      });

      $('namePresets').addEventListener('click', function (e) {
        if (!ed) return;
        var gk = presetGroupKey();
        state.presets = state.presets || { income: [], windfall: [], fixed: [], monthly: [] };
        state.presets[gk] = state.presets[gk] || [];
        var delEl = e.target.closest('[data-preset-del]');
        if (delEl) {
          var di = Number(delEl.dataset.presetDel);
          state.presets[gk].splice(di, 1);
          saveState();
          renderPresets();
          return;
        }
        var chip = e.target.closest('[data-preset-idx]');
        if (chip) {
          var ci = Number(chip.dataset.presetIdx);
          if (state.presets[gk][ci] != null) {
            $('fName').value = state.presets[gk][ci];
            toast('이름을 불러왔어요');
          }
          return;
        }
        if (e.target.closest('#savePresetBtn')) {
          var val = $('fName').value.trim().slice(0, 60);
          if (!val) { toast('먼저 이름을 입력해 주세요'); try { $('fName').focus(); } catch (err) {} return; }
          if (state.presets[gk].indexOf(val) < 0) {
            state.presets[gk].push(val);
            saveState();
            renderPresets();
            toast('자주 쓰는 이름에 저장했어요');
          } else {
            toast('이미 저장된 이름이에요');
          }
        }
      });

      // 연도·월 점프
      el.monthLabelBtn.addEventListener('click', openMonthPicker);
      $('monthPickClose').addEventListener('click', closeMonthPicker);
      $('monthBackdrop').addEventListener('click', function (e) {
        if (e.target === this) closeMonthPicker();
      });
      $('prevYear').addEventListener('click', function () {
        pickerYear--;
        renderMonthPicker();
      });
      $('nextYear').addEventListener('click', function () {
        pickerYear++;
        renderMonthPicker();
      });
      $('monthGrid').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-pick-month]');
        if (!b) return;
        jumpToMonth(pickerYear, Number(b.dataset.pickMonth));
        closeMonthPicker();
        toast(pickerYear + '년 ' + (Number(b.dataset.pickMonth) + 1) + '월로 이동했어요');
      });
      document.querySelector('.quick-row').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-jump]');
        if (!b) return;
        if (b.dataset.jump === 'this') {
          jumpToMonth(now.getFullYear(), now.getMonth());
        } else {
          var idx = now.getFullYear() * 12 + now.getMonth() + 1;
          jumpToMonth(Math.floor(idx / 12), idx % 12);
        }
        closeMonthPicker();
      });

      el.viewSeg.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-view]');
        if (!b) return;
        state.view = b.dataset.view;
        saveState();
        render();
      });

      // 카드: 추가 / 체크 / 항목 열기
      el.cardGrid.addEventListener('click', function (e) {
        var more = e.target.closest('[data-more]');
        if (more) {
          expandedGroups[more.dataset.more] = !expandedGroups[more.dataset.more];
          render();
          return;
        }
        var add = e.target.closest('[data-add]');
        if (add) {
          openEditor({ mode: 'add', group: add.dataset.add });
          return;
        }
        var del = e.target.closest('[data-del]');
        if (del) {
          e.stopPropagation();
          deleteItemById(del.dataset.del);
          return;
        }
        var chk = e.target.closest('[data-check]');
        if (chk) {
          e.stopPropagation();
          togglePaid(chk.dataset.check);
          return;
        }
        if (Date.now() < suppressClickUntil) return;
        if (e.target.closest('[data-handle]')) return;
        var item = e.target.closest('.item');
        if (item) {
          if (e.target.closest('[data-priv-edit]')) {
            openEditor({ mode: 'edit', id: item.dataset.id, group: item.dataset.group });
            return;
          }
          if (item.dataset.private === '1') {
            if (item.dataset.locked === '1') revealedIds[item.dataset.id] = true;
            else delete revealedIds[item.dataset.id];
            render();
            return;
          }
          openEditor({ mode: 'edit', id: item.dataset.id, group: item.dataset.group });
        }
      });

      el.cardGrid.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        var item = e.target.closest('.item');
        if (!item || e.target.closest('[data-check]')) return;
        e.preventDefault();
        if (item.dataset.private === '1') {
          if (item.dataset.locked === '1') revealedIds[item.dataset.id] = true;
          else delete revealedIds[item.dataset.id];
          render();
          return;
        }
        openEditor({ mode: 'edit', id: item.dataset.id, group: item.dataset.group });
      });

      el.flowRoot.addEventListener('click', function (e) {
        var chk = e.target.closest('[data-check]');
        if (chk) {
          e.stopPropagation();
          togglePaid(chk.dataset.check);
          return;
        }
        var row = e.target.closest('.tl-row');
        if (row) {
          if (row.dataset.private === '1') {
            if (row.dataset.locked === '1') revealedIds[row.dataset.id] = true;
            else delete revealedIds[row.dataset.id];
            render();
            return;
          }
          openEditor({ mode: 'edit', id: row.dataset.id, group: row.dataset.group });
        }
      });

      // 구매예정 · 위시리스트 · 포인트구매
      el.planWrap.addEventListener('click', function (e) {
        var more = e.target.closest('[data-more]');
        if (more) {
          expandedGroups[more.dataset.more] = !expandedGroups[more.dataset.more];
          render();
          return;
        }
        var pmore = e.target.closest('[data-point-more]');
        if (pmore) {
          expandedGroups.point = !expandedGroups.point;
          render();
          return;
        }
        var add = e.target.closest('[data-plan-add]');
        if (add) { openPlanEditor({ mode: 'add', section: add.dataset.planAdd }); return; }
        var pAdd = e.target.closest('[data-point-add]');
        if (pAdd) { openPlanEditor({ mode: 'add', section: 'point' }); return; }
        var pchk = e.target.closest('[data-pcheck]');
        if (pchk) {
          e.stopPropagation();
          togglePointDone(pchk.dataset.pcheck);
          return;
        }
        var pdel = e.target.closest('[data-pdel]');
        if (pdel) {
          e.stopPropagation();
          planRemoveItem(pdel.dataset.pdel);
          saveState();
          render();
          toast('삭제했어요');
          return;
        }
        var mv = e.target.closest('[data-pmove]');
        if (mv) {
          e.stopPropagation();
          movePlanItem(mv.dataset.pmove);
          return;
        }
        if (Date.now() < suppressClickUntil) return;
        if (e.target.closest('[data-pgrip]')) return;
        var item = e.target.closest('.pitem');
        if (item) {
          if (e.target.closest('[data-priv-edit]')) {
            openPlanEditor({ mode: 'edit', id: item.dataset.pid });
            return;
          }
          if (item.dataset.private === '1') {
            if (item.dataset.locked === '1') revealedIds[item.dataset.pid] = true;
            else delete revealedIds[item.dataset.pid];
            render();
            return;
          }
          openPlanEditor({ mode: 'edit', id: item.dataset.pid });
        }
      });

      el.planWrap.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        var item = e.target.closest('.pitem');
        if (!item) return;
        e.preventDefault();
        if (item.dataset.private === '1') {
          if (item.dataset.locked === '1') revealedIds[item.dataset.pid] = true;
          else delete revealedIds[item.dataset.pid];
          render();
          return;
        }
        openPlanEditor({ mode: 'edit', id: item.dataset.pid });
      });

      $('planClose').addEventListener('click', closePlanEditor);
      $('planCancel').addEventListener('click', closePlanEditor);
      $('planSave').addEventListener('click', savePlanEditor);
      $('planDelete').addEventListener('click', deletePlanItem);
      $('planBackdrop').addEventListener('click', function (e) {
        if (e.target === this) closePlanEditor();
      });
      $('planScopeSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-plan-scope]');
        if (!b || !ped) return;
        ped.section = b.dataset.planScope;
        if (ped.mode === 'add') $('planTitle').textContent = PLAN[ped.section].title + ' 추가';
        updatePlanScopeUI();
      });
      $('pAmount').addEventListener('input', function () {
        var d = this.value.replace(/[^\d]/g, '');
        this.value = d ? nf.format(Number(d.slice(0, 12))) : '';
      });

      // 데이터 내보내기·불러오기
      $('exportBtn').addEventListener('click', exportData);
      $('importBtn').addEventListener('click', importData);
      $('forceReloadBtn').addEventListener('click', function () {
        location.replace(location.pathname + '?v=' + Date.now());
      });

      el.flowRoot.addEventListener('input', function (e) {
        if (!e.target || e.target.id !== 'fStartBal') return;
        var d = e.target.value.replace(/[^\d]/g, '');
        e.target.value = d ? nf.format(Number(d.slice(0, 12))) : '';
      });

      el.flowRoot.addEventListener('change', function (e) {
        if (!e.target || e.target.id !== 'fStartBal') return;
        var key = currentKey();
        var d = e.target.value.replace(/[^\d]/g, '');
        var val = Number(d) || 0;
        var prev = Number((state.startBal || {})[key]) || 0;
        if (val === prev) return;
        state.startBal = state.startBal || {};
        if (val > 0) state.startBal[key] = val;
        else delete state.startBal[key];
        saveState();
        render();
      });

      // 시트
      $('edClose').addEventListener('click', closeEditor);
      $('edCancel').addEventListener('click', closeEditor);
      $('edSave').addEventListener('click', saveEditor);
      var delBtn = $('edDelete');
      if (delBtn) delBtn.addEventListener('click', deleteCurrent);
      $('sheetBackdrop').addEventListener('click', function (e) {
        if (e.target === this) closeEditor();
      });

      $('scopeSeg').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-scope]');
        if (!b) return;
        ed.scope = b.dataset.scope;
        updateScopeUI();
      });

      $('resetOverride').addEventListener('click', function () {
        if (!ed) return;
        var key = currentKey();
        if (state.overrides[key]) {
          delete state.overrides[key][ed.id];
          if (!Object.keys(state.overrides[key]).length) delete state.overrides[key];
        }
        saveState();
        var entry = findEntry(ed.id, key);
        if (entry) {
          $('fName').value = entry.base.name;
          $('fAmount').value = num(entry.base.amount);
          $('fDay').value = entry.base.day || '';
          $('fCategory').value = entry.base.category;
        }
        updateScopeUI();
        render();
        toast('이번 달 수정을 되돌렸어요');
      });

      $('fRecurring').addEventListener('change', function () {
        if (!ed) return;
        if (ed.mode === 'add') {
          var rec = $('fRecurring').checked;
          var gname = ed.type === 'income'
            ? (ed.group === 'income' || rec ? '들어올 돈' : '예상외 수입')
            : (rec ? '고정지출' : '이번달 지출');
          $('edTitle').textContent = gname + ' 추가';
        }
        updateRepeatHint();
        updateCategoryOptions();
        updateInstallmentUI();
      });

      $('fInstall').addEventListener('change', function () {
        updateInstallmentUI();
      });

      // 숫자 입력 포맷
      $('fAmount').addEventListener('input', function () {
        var d = this.value.replace(/[^\d]/g, '');
        this.value = d ? nf.format(Number(d.slice(0, 12))) : '';
      });
      ['fDay', 'fInstNo', 'fInstTotal'].forEach(function (id) {
        $(id).addEventListener('input', function () {
          this.value = this.value.replace(/[^\d]/g, '');
        });
      });

      // 테마
      el.themeBtn.addEventListener('click', function () {
        $('themeList').querySelectorAll('.theme-opt').forEach(function (b) {
          b.classList.toggle('active', b.dataset.themePick === state.theme);
        });
        $('themeBackdrop').classList.add('open');
        document.body.classList.add('locked');
      });
      $('themeClose').addEventListener('click', closeTheme);
      $('themeBackdrop').addEventListener('click', function (e) {
        if (e.target === this) closeTheme();
      });
      $('themeList').addEventListener('click', function (e) {
        var b = e.target.closest('[data-theme-pick]');
        if (!b) return;
        state.theme = b.dataset.themePick;
        saveState();
        render();
        closeTheme();
        toast(THEMES[state.theme].name + ' 테마로 바꿨어요');
      });

      function closeTheme() {
        $('themeBackdrop').classList.remove('open');
        document.body.classList.remove('locked');
      }

      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        if ($('sheetBackdrop').classList.contains('open')) closeEditor();
        else if ($('planBackdrop').classList.contains('open')) closePlanEditor();
        else if ($('monthBackdrop').classList.contains('open')) closeMonthPicker();
        else if ($('themeBackdrop').classList.contains('open')) closeTheme();
      });

      bindPointer();
      bindPlanPointer();
    }

    /* =========================================================
       9. 시작
       ========================================================= */
    cacheEls();
    state = loadState();
    // 마이그레이션 결과는 즉시 저장해 구조를 정리
    saveState();
    bindEvents();
    render();
  })();
  </script>
</body>
</html>
